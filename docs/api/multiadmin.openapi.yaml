                $ref: '#/components/schemas/multiadmin.SetPostgresRestartsEnabledResponse'
          description: Success
        "400":
          $ref: '#/components/responses/RPCError'
        "401":
          $ref: '#/components/responses/RPCError'
        "404":
          $ref: '#/components/responses/RPCError'
        default:
          $ref: '#/components/responses/RPCError'
      summary: Set automatic PostgreSQL restarts
      tags:
        - poolers
  /api/v1/poolers/{pooler_id.cell}/{pooler_id.name}/registration:
    get:
      description: |-
        GetPoolerRegistration reads topology without contacting the pooler process.
         Errors and recovery:
         NotFound (5) means the registration is absent; missing cell configuration is FailedPrecondition (9).
         A dependency error is never evidence of absence: retry Unavailable (14) or DeadlineExceeded (4)
         with backoff. Save incarnationId and version
         with the member identity and shard before fencing it. After an uncertain retirement, absence or a
         different incarnation establishes that the old registration is gone; it does not identify which
         request removed it. A surviving matching incarnation still needs reconciliation.
      operationId: multiadmin.MultiadminService.GetPoolerRegistration
      parameters:
        - description: cell is the Multigres cell where the component is located
          in: path
          name: pooler_id.cell
          required: true
          schema:
            title: cell
            type: string
        - description: |-
            name is a unique identifier for the component within the multigres
             cluster.
          in: path
          name: pooler_id.name
          required: true
          schema:
            title: name
            type: string
        - description: component identifies the type of Multigres component (multipooler, multigateway, or multiorch)
          in: query
          name: poolerId.component
          schema:
            $ref: '#/components/schemas/clustermetadata.ID.ComponentType'
            title: component
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multiadmin.GetPoolerRegistrationResponse'
          description: Success
        "400":
          $ref: '#/components/responses/RPCError'
        "401":
          $ref: '#/components/responses/RPCError'
        "404":
          $ref: '#/components/responses/RPCError'
        "409":
          $ref: '#/components/responses/RPCError'
        "503":
          $ref: '#/components/responses/RPCError'
        "504":
          $ref: '#/components/responses/RPCError'
        default:
          $ref: '#/components/responses/RPCError'
      summary: Get a pooler registration
      tags:
        - poolers
  /api/v1/poolers/{pooler_id.cell}/{pooler_id.name}/retire:
    post:
      description: |-
        RetirePooler conditionally removes the registration of an already-fenced process incarnation.
         The caller must positively establish that this exact pooler process and its PostgreSQL process
         are stopped or permanently isolated from topology, peers, and clients, and that restart or
         reconnection is prevented. A failed probe, timeout, or partition is not fencing evidence.
         fencingAcknowledged is the caller's assertion of this infrastructure precondition, not verification
         by Multiadmin. This operation does not stop processes, fence machines, change consensus membership,
         promote a replica, or drive replication. Multigres owns elections and consensus transitions.
         Errors and recovery:
         InvalidArgument (3) indicates missing identity, shard, incarnation, or version. FailedPrecondition (9)
         means fencing was not acknowledged or the registration predates incarnation IDs. Aborted (10), HTTP
         409, means an identity, shard, or version precondition no longer matches; nothing is removed.
         Deletion atomically checks the observed version. An already-absent registration succeeds. Repeat an
         identical request safely after an uncertain response: it cannot delete a newer registration. A newer
         registration returns Aborted; use GetPoolerRegistration to determine whether the old incarnation is
         gone. Unavailable (14) or DeadlineExceeded (4) may occur after deletion committed. Never replace
         preconditions with a newer incarnation merely to make a retry succeed.
      operationId: multiadmin.MultiadminService.RetirePooler
      parameters:
        - description: cell is the Multigres cell where the component is located
          in: path
          name: pooler_id.cell
          required: true
          schema:
            title: cell
            type: string
        - description: |-
            name is a unique identifier for the component within the multigres
             cluster.
          in: path
          name: pooler_id.name
          required: true
          schema:
            title: name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                fencingAcknowledged:
                  description: Required acknowledgement of positive infrastructure fencing, as described by RetirePooler.
                  enum:
                    - true
                  title: fencing_acknowledged
                  type: boolean
                incarnationId:
                  description: Process incarnation read before fencing; required and never inferred from a name or address.
                  minLength: 1
                  title: incarnation_id
                  type: string
                poolerId:
                  $ref: '#/components/schemas/clustermetadata.ID'
                  description: Exact old member identity. Cell and name are required; component is MULTIPOOLER or omitted.
                  title: pooler_id
                shardKey:
                  $ref: '#/components/schemas/clustermetadata.ShardKey'
                  description: Database, table group, and shard of the fenced member; all are required.
                  required:
                    - database
                    - tableGroup
                    - shard
                  title: shard_key
                version:
                  description: Registration snapshot version from GetPoolerRegistration; required.
                  minLength: 1
                  title: version
                  type: string
              required:
                - shardKey
                - incarnationId
                - version
                - fencingAcknowledged
              title: RetirePoolerRequest
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multiadmin.RetirePoolerResponse'
          description: Success
        "400":
          $ref: '#/components/responses/RPCError'
        "401":
          $ref: '#/components/responses/RPCError'
        "404":
          $ref: '#/components/responses/RPCError'
        "409":
          $ref: '#/components/responses/RPCError'
        "503":
          $ref: '#/components/responses/RPCError'
        "504":
          $ref: '#/components/responses/RPCError'
        default:
          $ref: '#/components/responses/RPCError'
      summary: Retire a fenced pooler registration
      tags:
        - poolers
  /api/v1/poolers/{pooler_id.cell}/{pooler_id.name}/status:
    get:
      description: |-
        Errors and recovery:
         InvalidArgument (3) indicates an incomplete pooler ID. A missing topology record returns NotFound
         (5), while other topology errors become Internal (13). Every downstream Status error becomes
         Unavailable (14), including timeouts and operation rejections. Retry this read with bounded backoff;
         code 14 alone does not identify the underlying cause.
      operationId: multiadmin.MultiadminService.GetPoolerStatus
      parameters:
        - description: cell is the Multigres cell where the component is located
          in: path
          name: pooler_id.cell
          required: true
          schema:
            title: cell
            type: string
        - description: |-
            name is a unique identifier for the component within the multigres
             cluster.
          in: path
          name: pooler_id.name
          required: true
          schema:
            title: name
            type: string
        - description: component identifies the type of Multigres component (multipooler, multigateway, or multiorch)
          in: query
          name: poolerId.component
          schema:
            $ref: '#/components/schemas/clustermetadata.ID.ComponentType'
            title: component
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multiadmin.GetPoolerStatusResponse'
          description: Success
        "400":
          $ref: '#/components/responses/RPCError'
        "401":
          $ref: '#/components/responses/RPCError'
        "404":
          $ref: '#/components/responses/RPCError'
        default:
          $ref: '#/components/responses/RPCError'
      summary: Get pooler status
      tags:
        - poolers
  /api/v1/shards/{shard_key.database}/{shard_key.table_group}/{shard_key.shard}/rule-change:
    post:
      description: |-
        The cert is either supplied explicitly by the caller or, if
         unsafe_derive_cert is set, derived by multiadmin from a Status probe of
         the proposed cohort. Multiadmin then forwards the request to the shard's
         multiorch.

         Errors and recovery:
         Missing shard, proposal, or certificate choice returns InvalidArgument (3). Dependency, quorum, and
         multiorch failures can occur before or after recruitment has modified consensus state. An error,
         timeout, or lost response does not guarantee rollback, and this API provides no idempotency key.
         Before retrying, use GetPoolers and GetPoolerStatus to inspect the shard and involved cohort:
         compare currentPosition, termRevocation, and replicationPrimary against the intended transition.
         Confirm the installed rule and serving leader, or reconcile the partially applied transition before
         preparing another request. An unreachable member leaves its state uncertain; do not derive a new
         unsafe certificate or assume an old certificate is still valid solely from the error code.
      operationId: multiadmin.MultiadminService.ApplyCertifiedRuleChange
      parameters:
        - description: Database name.
          in: path
          name: shard_key.database
          required: true
          schema:
            title: database
            type: string
        - description: TableGroup name.
          in: path
          name: shard_key.table_group
          required: true
          schema:
            title: table_group
            type: string
        - description: Shard name. If range based sharding is used, it should match key_range.
          in: path
          name: shard_key.shard
          required: true
          schema:
            title: shard
            type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - properties:
                    proposedTransition:
                      $ref: '#/components/schemas/clustermetadata.RulePosition'
                      description: |-
                        The transition to install. The caller must populate proposal's leader_id,
                         cohort_members, and durability_policy. The caller may also populate
                         proposal's rule_number, coordinator_id, and creation_time; if any of
                         those are left unset, multiadmin fills them in (rule_number from the
                         cert's revoked_below_term, coordinator_id from the chosen multiorch,
                         creation_time from "now").

                         decision is the caller's discovered outgoing rule — optional. If left
                         unset with unsafe_derive_cert, multiadmin discovers it itself by probing
                         the proposed cohort (see probeMostAdvanced), the same way it derives
                         frozen_lsn. See multiorch.ApplyCertifiedRuleChangeRequest for why
                         decision may name a rule observed only as an undecided proposal (the
                         cert makes propagating it "free").
                      title: proposed_transition
                    reason:
                      description: Free-text, recorded in rule_history for audit.
                      title: reason
                      type: string
                    shardKey:
                      $ref: '#/components/schemas/clustermetadata.ShardKey'
                      description: Shard to apply the rule change to.
                      title: shard_key
                - oneOf:
                    - properties:
                        cert:
                          $ref: '#/components/schemas/clustermetadata.ExternallyCertifiedRevocation'
                          description: |-
                            Caller-supplied cert. The caller must populate outgoing_rule_number
                             and frozen_lsn. term_revocation may be left empty; if so, multiadmin
                             fills it in (accepted_coordinator_id from the chosen multiorch,
                             coordinator_initiated_at from "now", revoked_below_term picked by
                             multiadmin to be greater than outgoing_rule_number.coordinator_term).

                             For initial leader appointment (no prior rule), pass a zero RuleNumber
                             and frozen_lsn="0/0".
                          title: cert
                      required:
                        - cert
                      title: cert
                      type: object
                    - properties:
                        unsafeDeriveCert:
                          $ref: '#/components/schemas/multiadmin.UnsafeDeriveCertOptions'
                          description: |-
                            Ask multiadmin to derive outgoing_rule_number and frozen_lsn by
                             probing the proposed cohort for their current ConsensusStatus.
                             term_revocation and rule identity fields are then filled in as above.
                          title: unsafe_derive_cert
                      required:
                        - unsafeDeriveCert
                      title: unsafe_derive_cert
                      type: object
                    - not:
                        anyOf:
                          - properties:
                              cert: {}
                            required:
                              - cert
                          - properties:
                              unsafeDeriveCert: {}
                            required:
                              - unsafeDeriveCert
              anyOf:
                - properties:
                    cert: {}
                  required:
                    - cert
                - properties:
                    unsafeDeriveCert: {}
                  required:
                    - unsafeDeriveCert
              description: |-
                ApplyCertifiedRuleChangeRequest installs a new shard rule using an externally
                 certified revocation. See multiorch.ApplyCertifiedRuleChangeRequest for the
                 safety contract behind the cert.

                 Multiadmin populates the identity and timing fields that the caller did not
                 fill in (rule_number, coordinator_id, creation_time, term_revocation.*) by
                 looking up a multiorch in the shard's cell and using "now" for timestamps,
                 then forwards the fully-populated request to that multiorch.
              title: ApplyCertifiedRuleChangeRequest
              type: object
              unevaluatedProperties: false
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multiadmin.ApplyCertifiedRuleChangeResponse'
          description: Success
        "400":
          $ref: '#/components/responses/RPCError'
        "401":
          $ref: '#/components/responses/RPCError'
        "404":
          $ref: '#/components/responses/RPCError'
        default:
          $ref: '#/components/responses/RPCError'
      summary: Apply a certified shard rule change
      tags:
        - shards
  /api/v1/shards/{shard_key.database}/{shard_key.table_group}/{shard_key.shard}/switch-primary:
    post:
      description: |-
        Errors and recovery:
         FailedPrecondition (9), mapped to HTTP 400, means no standby was found for promotion. NotFound (5)
         means discovery found no primary; cell lookup failures can also hide a primary. Every
         ResignLeadership error becomes Internal (13), including timeouts and rejected preconditions.
         Demotion may already have occurred when an error or lost response is observed. Before retrying, use
         GetPoolers and GetPoolerStatus to inspect the old leader and candidates and allow an in-progress
         election to settle. A successful response confirms the old primary was quiesced; it does not confirm
         that a replacement primary is serving. Blind retry can demote the replacement primary.
      operationId: multiadmin.MultiadminService.SwitchPrimary
      parameters:
        - description: Database name.
          in: path
          name: shard_key.database
          required: true
          schema:
            title: database
            type: string
        - description: TableGroup name.
          in: path
          name: shard_key.table_group
          required: true
          schema:
            title: table_group
            type: string
        - description: Shard name. If range based sharding is used, it should match key_range.
          in: path
          name: shard_key.shard
          required: true
          schema:
            title: shard
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              description: SwitchPrimaryRequest identifies the shard and the audit reason for a graceful switchover.
              properties:
                reason:
                  description: Free-text reason recorded in rule_history for audit.
                  title: reason
                  type: string
                shardKey:
                  $ref: '#/components/schemas/clustermetadata.ShardKey'
                  description: Shard to perform the switchover on (required).
                  title: shard_key
              title: SwitchPrimaryRequest
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/multiadmin.SwitchPrimaryResponse'
          description: Success
        "400":
          $ref: '#/components/responses/RPCError'
        "401":
          $ref: '#/components/responses/RPCError'
        "404":
          $ref: '#/components/responses/RPCError'
        default:
          $ref: '#/components/responses/RPCError'
      summary: Switch the shard primary
      tags:
        - shards
components:
  responses:
    RPCError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/google.rpc.Status'
      description: Vanguard REST error. The numeric code uses gRPC values. See the operation description for current classification exceptions and recovery guidance; mutation errors do not imply rollback.
  schemas:
    clustermetadata.BackupLocation:
      allOf:
        - properties:
            authoritativeGeneration:
              description: |-
                The repository generation that takes backups and renders as repo1 — the
                 restore hint for poolers that must render pgbackrest config before a
                 database exists (restore-at-join, disaster recovery). The
                 multigres.pgbackrest_repos sidecar table remains the consensus-fenced
                 truth for all writes; this field is written after the table commits, so
                 a stale value is harmless (it names the previous authoritative repo,
                 whose lineage is equally restorable during a rotation overlap).
                 Unset (0) means generation 1, the conventional initial repository.
              pattern: ^-?[0-9]+$
              title: authoritative_generation
              type: string
            requireInitialRepoEncryption:
              description: |-
                If true, the initial backup repository must be encrypted: poolers refuse
                 to start (and to bootstrap the stanza) unless a cipher key for the
                 initial repository is present in the mounted key file. If false, a
                 present key still enables encryption; absence of a key produces an
                 unencrypted repository.
              title: require_initial_repo_encryption
              type: boolean
        - oneOf:
            - properties:
                filesystem:
                  $ref: '#/components/schemas/clustermetadata.FilesystemBackup'
                  title: filesystem
              required:
                - filesystem
              title: filesystem
              type: object
            - properties:
                s3:
                  $ref: '#/components/schemas/clustermetadata.S3Backup'
                  title: s3
              required:
                - s3
              title: s3
              type: object
            - not:
                anyOf:
                  - properties:
                      filesystem: {}
                    required:
                      - filesystem
                  - properties:
                      s3: {}
                    required:
                      - s3
      description: BackupLocation specifies where backups are stored
      title: BackupLocation
      type: object
      unevaluatedProperties: false
    clustermetadata.Cell:
      additionalProperties: false
      description: |-
        Cell describes how to connect to a cell topology.
         These records are stored in the global topology server.
      properties:
        metadata:
          description: |-
            metadata is an opaque document describing this cell, supplied by whatever
             deployed it: an operator, a provisioning tool, or a human.
          title: metadata
          type: string
        name:
          description: name for this cell
          title: name
          type: string
        root:
          description: |-
            root is the namespace or directory path within the topology service
             where this cell's metadata is stored. Used only when connecting to server_addresses.
          title: root
          type: string
        serverAddresses:
          description: server_address is the network address of the cell topology service.
          items:
            type: string
          title: server_addresses
          type: array
      title: Cell
      type: object
    clustermetadata.ConsensusStatus:
      additionalProperties: false
      description: |-
        ConsensusStatus is a pooler's complete view of its position in the distributed
         system. It combines three layers with different durability and precision guarantees:

          1. term_revocation (disk-backed, authoritative)
             Written to local disk before responding; survives process restarts.
             Records the highest coordinator term accepted and the coordinator's identity.

          2. current_position (postgres-WAL-backed, authoritative)
             The highest ShardRule committed to local WAL (from rule_history) and the
             current LSN. Authoritative because postgres WAL is durable and ordered.

          3. replication_primary (best-effort, coordinator-provided)
             The primary this pooler should be pointed at for replication, plus the
             rule under which that primary holds leadership. May be ahead of
             current_position; not persisted and may be stale after restarts.
      properties:
        currentPosition:
          $ref: '#/components/schemas/clustermetadata.PoolerPosition'
          description: |-
            current_position is the highest rule this pooler has committed to local WAL
             and the latest WAL position.
          title: current_position
        id:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: |-
            id identifies the pooler that produced this status. Makes ConsensusStatus
             self-describing when passed around without a surrounding envelope.
          title: id
        recruitBlockedUntil:
          $ref: '#/components/schemas/clustermetadata.LsnPosition'
          description: |-
            recruit_blocked_until, if set, is the minimum position (rule numbers +
             LSN) this pooler must reach before Recruit() may succeed — recorded
             before pg_rewind, which rewinds to the last shared checkpoint rather
             than the last common WAL position and so can silently discard
             acknowledged, durably-stored transactions. Omitted once current_position
             clears it — its mere presence here is what Recruit() checks, rather than
             comparing against stored state itself.

             Worst case this guards against: in a three node shard, two failed
             leader-promotion attempts leave two poolers with divergent WAL;
             a third promotion succeeds and rewinds them both back to their last
             shared checkpoint (which can be well behind their fork point); the
             new leader then dies before either catches back up. That WAL gap is
             now unrecoverable anywhere in the cluster — without this floor,
             either pooler could still be recruited as the next leader despite
             silently missing committed data.
          title: recruit_blocked_until
        replicationPrimary:
          $ref: '#/components/schemas/clustermetadata.ReplicationPrimary'
          description: |-
            replication_primary is the pooler's best-effort view of who its primary
             should be (and under what rule). May reflect a rule ahead of
             current_position when the pooler has been informed of a newer rule that
             has not yet been replicated through WAL.
          title: replication_primary
        termRevocation:
          $ref: '#/components/schemas/clustermetadata.TermRevocation'
          description: |-
            term_revocation records the highest coordinator term this pooler has revoked for.

             This is a monotonic promise floor: it is always reported here even after it
             has been satisfied (the pooler's own committed rule caught up to or past
             revoked_below_term), so its mere presence does NOT mean the pooler is still
             recruited. Consumers must check whether it still revokes the pooler's own
             position — see consensus.IsSelfRevoked.

             TODO: we could omit an obsolete revocation from this reported status (once
             the committed coordinator term reaches revoked_below_term) so that absence
             alone signals "not recruited". Deliberately not done yet: keeping the raw
             revocation visible aids debugging (a lingering self-revoking revocation is
             exactly the signal for a stranded pooler), and the omit condition is subtle
             — it must be the committed-term check, not IsSelfRevoked, or the
             runaway-recruit subterm-override case would drop term information that
             NewTermRevocation relies on and risk term reuse.
          title: term_revocation
      title: ConsensusStatus
      type: object
    clustermetadata.Database:
      additionalProperties: false
      properties:
        backupLocation:
          $ref: '#/components/schemas/clustermetadata.BackupLocation'
          description: Backup location configuration
          title: backup_location
        bootstrapDurabilityPolicy:
          $ref: '#/components/schemas/clustermetadata.DurabilityPolicy'
          description: |-
            bootstrap_durability_policy is the durability policy applied when
             initializing this database for the first time. Set at database creation.
          title: bootstrap_durability_policy
        cells:
          description: List of cell identifiers where this database should be deployed
          items:
            type: string
          title: cells
          type: array
        name:
          description: Name of the database
          title: name
          type: string
      title: Database
      type: object
    clustermetadata.DurabilityPolicy:
      additionalProperties: false
      description: |-
        DurabilityPolicy defines consensus quorum rules for a shard.
         These policies are stored locally in each shard's postgres database
         and replicated via postgres streaming replication.
      properties:
        description:
          description: description is a human-readable summary of this policy
          title: description
          type: string
        policyName:
          description: policy_name is a human-readable identifier (e.g., "AT_LEAST_2")
          title: policy_name
          type: string
        policyVersion:
          description: policy_version allows policy evolution over time
          pattern: ^-?[0-9]+$
          title: policy_version
          type: string
        quorumType:
          $ref: '#/components/schemas/clustermetadata.QuorumType'
          description: quorum_type determines which quorum algorithm to use
          title: quorum_type
        requiredCount:
          description: |-
            required_count is the number of nodes/cells required for quorum
             - For QUORUM_TYPE_AT_LEAST_N: number of nodes required from discovered cohort
             - For QUORUM_TYPE_MULTI_CELL_AT_LEAST_N: number of distinct cells required,
               with at least one node from each cell
          format: int32
          title: required_count
          type: integer
      title: DurabilityPolicy
      type: object
    clustermetadata.ExternallyCertifiedRevocation:
      additionalProperties: false
      description: |-
        ExternallyCertifiedRevocation certifies that the outgoing cohort's revocation
         has been established by an external agent rather than through normal Recruit
         RPCs. The incoming cohort is still recruited normally via Recruit RPCs.

         The external actor certifies:

          1. No pooler in the outgoing cohort can make progress beyond frozen_lsn
             under term_revocation.outgoing_rule — all durable transactions at the
             time of revocation are captured at or below that position.

          2. The term in term_revocation is globally unique; no other coordinator has
             used or will use it.

         The coordinator names itself as the initiator in term_revocation even though
         it is acting on an external request.
      properties:
        frozenLsn:
          description: |-
            The LSN at which the outgoing cohort's progress is frozen. No durable writes
             occurred beyond this position under term_revocation.outgoing_rule. The chosen
             leader's WAL position must meet or exceed this LSN.
          title: frozen_lsn
          type: string
        termRevocation:
          $ref: '#/components/schemas/clustermetadata.TermRevocation'
          description: |-
            Records the unique coordinator term for this proposal, the coordinator
             facilitating the request, and the outgoing_rule the cohort is being
             transitioned from. The coordinator fills this in even though it is acting
             on behalf of an external operator request.
          title: term_revocation
      title: ExternallyCertifiedRevocation
      type: object
    clustermetadata.FilesystemBackup:
      additionalProperties: false
      description: FilesystemBackup stores backups on local filesystem
      properties:
        path:
          description: Absolute path to backup directory
          title: path
          type: string
      title: FilesystemBackup
      type: object
    clustermetadata.ID:
      additionalProperties: false
      description: ID is a globally unique pooler identifier.
      properties:
        cell:
          description: cell is the Multigres cell where the component is located
          title: cell
          type: string
        component:
          $ref: '#/components/schemas/clustermetadata.ID.ComponentType'
          description: component identifies the type of Multigres component (multipooler, multigateway, or multiorch)
          title: component
        name:
          description: |-
            name is a unique identifier for the component within the multigres
             cluster.
          title: name
          type: string
      title: ID
      type: object
    clustermetadata.ID.ComponentType:
      description: ComponentType represents the type of Multigres component
      enum:
        - UNKNOWN
        - MULTIPOOLER
        - MULTIGATEWAY
        - MULTIORCH
      title: ComponentType
      type: string
    clustermetadata.KeyRange:
      additionalProperties: false
      description: KeyRange represents a range of keys for sharding
      properties:
        end:
          description: end is the end key of the range (exclusive)
          format: byte
          title: end
          type: string
        start:
          description: start is the start key of the range (inclusive)
          format: byte
          title: start
          type: string
      title: KeyRange
      type: object
    clustermetadata.LsnPosition:
      additionalProperties: false
      description: |-
        LsnPosition mirrors PoolerPosition but carries RuleNumberPosition instead
         of the full RulePosition, paired with a WAL LSN.
      properties:
        lsn:
          title: lsn
          type: string
        position:
          $ref: '#/components/schemas/clustermetadata.RuleNumberPosition'
          title: position
      title: LsnPosition
      type: object
    clustermetadata.Multigateway:
      additionalProperties: false
      description: Multigateway represents metadata about a running multigateway component instance in the cluster.
      properties:
        hostname:
          description: Fully qualified domain name of the host.
          title: hostname
          type: string
        id:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: id is the unique name of the multi gateway in the cluster.
          title: id
        pidPrefix:
          description: |-
            pid_prefix is the 12-bit prefix encoded into PIDs sent to clients.
             Used for cross-gateway cancel request routing. Assigned at registration time.
          title: pid_prefix
          type: integer
        portMap:
          additionalProperties:
            format: int32
            title: value
            type: integer
          description: Map of named ports. Normally this should include postgres and grpc.
          title: port_map
          type: object
      title: Multigateway
      type: object
    clustermetadata.Multiorch:
      additionalProperties: false
      description: Multiorch represents information about a running instance of multiorch.
      properties:
        hostname:
          description: Fully qualified domain name of the host.
          title: hostname
          type: string
        id:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: id is the unique name of the Multiorch in the cluster.
          title: id
        portMap:
          additionalProperties:
            format: int32
            title: value
            type: integer
          description: Map of named ports. These are ports that MultiOrc exposes.
          title: port_map
          type: object
      title: Multiorch
      type: object
    clustermetadata.Multipooler:
      additionalProperties: false
      description: Multipooler represents metadata about a running multipooler component instance in the cluster.
      properties:
        hostname:
          description: Fully qualified domain name of the host.
          title: hostname
          type: string
        id:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: id is the unique identifier of the multipooler in the cluster.
          title: id
        incarnationId:
          description: |-
            incarnation_id identifies this process lifetime. Generated at startup and
             preserved across publication retries; a restarted or replacement process
             gets a new value even when its ID and addresses are reused. Older processes
             leave this empty and cannot be retired through the conditional public API.
          title: incarnation_id
          type: string
        keyRange:
          $ref: '#/components/schemas/clustermetadata.KeyRange'
          description: If range based sharding is used, range for the pooler's shard.
          title: key_range
        lifecycleStatus:
          $ref: '#/components/schemas/clustermetadata.PoolerLifecycle'
          description: |-
            LifecycleStatus is where the pooler is in its process lifecycle.

             Orthogonal to PoolerType (role) and PoolerServingStatus (query-serving
             readiness). Recorded in topology so the orchestrator can observe terminal
             lifecycle states even on cold start, not only over the health stream.
          title: lifecycle_status
        pgDataDir:
          description: |-
            PgDataDir is the PostgreSQL data directory path (from the PGDATA environment variable).
             Used by multiadmin to compute the primary's data directory for pgBackRest.
          title: pg_data_dir
          type: string
        poolerDir:
          description: PoolerDir is used by pgBackRest to compute the primary's data directory.
          title: pooler_dir
          type: string
        portMap:
          additionalProperties:
            format: int32
            title: value
            type: integer
          description: Map of named ports. These are ports that the pooler exposes. Initially, this will only be gRPC
          title: port_map
          type: object
        routingState:
          $ref: '#/components/schemas/clustermetadata.RoutingState'
          description: |-
            routing_state advertises this pooler's routing/HA role. When the
             multipooler publishes this field for itself, the writable PRIMARY
             (postgres out of recovery AND highest non-revoked committed leader)
             publishes both role and rule; every other pooler — including a consensus
             leader that is not yet writable — publishes role only, with rule omitted:
             a replica's rule bumps on every WAL rule it observes, and publishing it
             would churn etcd on every bump during failovers. A shutting-down pooler
             leaves routing_state unset entirely. This rule-dropping is specific to
             that publish path (pooler_record.go), not a constraint of the
             RoutingState message itself — see RoutingState below.
          title: routing_state
        servingStatus:
          $ref: '#/components/schemas/clustermetadata.PoolerServingStatus'
          description: PoolerServingStatus is the current type of the pooler.
          title: serving_status
        shardKey:
          $ref: '#/components/schemas/clustermetadata.ShardKey'
          description: |-
            shard_key identifies which shard this pooler belongs to. It is used for
             routing requests to the correct pooler and for displaying metadata about
             the shard in dashboards. It is not expected to change for the lifetime of
             the pooler, but it is not immutable either — if the pooler moves to a
             different shard, this field should be updated to reflect the new shard.
          title: shard_key
        type:
          $ref: '#/components/schemas/clustermetadata.PoolerType'
          deprecated: true
          description: |-
            PoolerType is the kind of pooler: PRIMARY or REPLICA.

             TODO(pooler-type-removal): this label is now derived, not authoritative —
             the multipooler computes it at publish from routing_state + lifecycle
             (SHUTDOWN->UNKNOWN, else PRIMARY iff routing_state PRIMARY, else REPLICA;
             DRAINED is no longer produced) and nothing inside multigres reads it for
             identity. The remaining reader is the external multigres-operator
             (FindPrimaryPooler + drain + status role map). Once the operator switches
             those reads to routing_state.role == PRIMARY, this field can stop being
             published and then be removed.

             Deprecated to surface every remaining reader via staticcheck SA1019: the
             multipooler derives/publishes it (pooler_record) and reports it on Status;
             new decision reads should use routing_state instead.
          title: type
      title: Multipooler
      type: object
    clustermetadata.PoolerAddress:
      additionalProperties: false
      description: |-
        PoolerAddress identifies a pooler and carries the connection information a
         peer needs to reach its postgres. Used wherever consensus references a
         primary (CoordinatorProposal.proposal_leader, SetPrimaryRequest.leader,
         ReplicationPrimary.primary, etc.) without dragging the full Multipooler
         topology record onto the wire.
      properties:
        host:
          description: Hostname peers use to connect to this pooler's postgres.
          title: host
          type: string
        id:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: The pooler being addressed.
          title: id
        postgresPort:
          description: Port of this pooler's postgres instance.
          format: int32
          title: postgres_port
          type: integer
      title: PoolerAddress
      type: object
    clustermetadata.PoolerLifecycle:
      additionalProperties: false
      description: |-
        PoolerLifecycle pairs a PoolerLifecycleStatus with operator-readable
         context (reason) and a write timestamp (updated). Every caller that
         produces a PoolerLifecycle value sets all three fields together;
         readers use `updated` to compute "how long has this pooler been in
         state X" for diagnostics.
      properties:
        reason:
          description: Optional reason for the current lifecycle stage.
          title: reason
          type: string
        status:
          $ref: '#/components/schemas/clustermetadata.PoolerLifecycleStatus'
          title: status
        updated:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: Wall-clock time at which this lifecycle entry was written.
          title: updated
      title: PoolerLifecycle
      type: object
    clustermetadata.PoolerLifecycleStatus:
      description: |-
        PoolerLifecycleStatus represents where a pooler is in its process lifecycle.
         Orthogonal to PoolerType (role) and PoolerServingStatus (query-serving
         readiness). The pooler advances through these states as it boots, serves,
         and exits. The value is operator-visible via the Multipooler topology
         entry; the orchestrator's pooler watcher observes the
         LIFECYCLE_SHUTDOWN transition and tears down the per-pooler health
         stream.
      enum:
        - LIFECYCLE_UNKNOWN
        - LIFECYCLE_STARTING
        - LIFECYCLE_ACTIVE
        - LIFECYCLE_STOPPING
        - LIFECYCLE_SHUTDOWN
        - LIFECYCLE_QUARANTINED
      title: PoolerLifecycleStatus
      type: string
    clustermetadata.PoolerPosition:
      additionalProperties: false
      description: |-
        PoolerPosition describes a pooler's committed position in logical and physical
         time. It captures the highest RulePosition this pooler has replicated (or written,
         for a leader) and the latest WAL position.

         Used in Status and Recruit responses so the coordinator can determine
         which pooler is most advanced when selecting a promotion candidate.

         Comparison: prefer the pooler with the higher position (see RulePosition).
         Break ties by LSN.
      properties:
        lsn:
          description: |-
            The current real-time WAL head at the time of reading. Note that this is likely
             beyond the LSN at which the rule was committed. For a primary: pg_current_wal_lsn().
             For a standby: pg_last_wal_receive_lsn() (or pg_last_wal_replay_lsn() if receive is null).
          title: lsn
          type: string
        position:
          $ref: '#/components/schemas/clustermetadata.RulePosition'
          description: The highest rule position this pooler has committed to local WAL.
          title: position
      title: PoolerPosition
      type: object
    clustermetadata.PoolerServingStatus:
      description: |-
        PoolerServingStatus represents the serving status of the given Multipooler.

         To test "not serving", compare `!= SERVING` rather than against a specific
         not-serving value: both DISABLED and DRAINING are non-serving, and checking one
         alone would silently miss the other.
      enum:
        - SERVING
        - DISABLED
        - DRAINING
      title: PoolerServingStatus
      type: string
    clustermetadata.PoolerType:
      description: PoolerType represents the type of a given Multipooler.
      enum:
        - UNKNOWN
        - PRIMARY
        - REPLICA
        - DRAINED
      title: PoolerType
      type: string
    clustermetadata.QuorumType:
      description: QuorumType enumerates supported quorum algorithms
      enum:
        - QUORUM_TYPE_UNKNOWN
        - QUORUM_TYPE_AT_LEAST_N
        - QUORUM_TYPE_MULTI_CELL_AT_LEAST_N
      title: QuorumType
      type: string
    clustermetadata.RecruitIntent:
      additionalProperties: false
      description: |-
        RecruitIntent carries the coordinator's intent and context for a
         recruitment — a container (not flat fields) so it can grow without
         widening TermRevocation. Its first occupant is collective failover-backoff
         accounting: how many recruitment attempts have targeted the same decided
         baseline without the cohort advancing past it, letting independent
         orchestrators back off collectively without coordinating (see go/common/ha).
      properties:
        attempt:
          description: |-
            How many consecutive recruits have targeted replace_decision. Starts at 1 and
             increments while replace_decision is unchanged; resets to 1 when it advances
             (the cohort committed a newer decision).
          pattern: ^-?[0-9]+$
          title: attempt
          type: string
        replaceDecision:
          $ref: '#/components/schemas/clustermetadata.RuleNumber'
          description: |-
            The decided rule this recruitment intends to move past. Deliberately
             distinct from TermRevocation.outgoing_rule, which may be an undecided
             proposal under propagation — the attempt count must key on a settled
             decision, or a stuck proposal could never advance it and reset the count.
          title: replace_decision
      title: RecruitIntent
      type: object
    clustermetadata.ReplicationPrimary:
      additionalProperties: false
      description: |-
        ReplicationPrimary advertises the primary this pooler believes it should be
         pointed at for replication, along with the rule under which that primary
         holds leadership. The primary contact info is the main payload — it's how a
         pooler in a degraded state (partition, mid-bootstrap, SetPrimary-while-postgres-
         was-down) figures out who to reconnect replication to. The rule is supporting
         evidence and has secondary uses such as coordinators learning of rules newer
         than what's in any replica's WAL.

         Not persisted across pooler restarts — best-effort, populated by SetPrimary and
         Promote RPCs. Coordinators that notice a pooler has incorrect replication
         settings will re-inform it.
      properties:
        position:
          $ref: '#/components/schemas/clustermetadata.RulePosition'
          description: |-
            The rule position under which this primary holds leadership: decision is
             the last settled rule the sender observed, proposal is a newer rule the
             sender is establishing but has not yet confirmed decided (populated
             during a live promotion, when SetPrimary races the leader's own decide-
             in-progress write; nil once there is nothing left in flight). May be
             ahead of the pooler's own committed PoolerPosition while replication
             catches up. Coordinators compare this to what they would otherwise
             SetPrimary with — if it already matches, the SetPrimary is redundant and
             can be skipped.
          title: position
        primary:
          $ref: '#/components/schemas/clustermetadata.PoolerAddress'
          description: |-
            Contact info for the primary the pooler was last told to use. Snapshot
             from the most recent SetPrimary/Promote; treat as "what this pooler currently
             believes," not as the canonical primary for the cluster.
          title: primary
        rewindReady:
          description: |-
            Whether the primary in this record is safe to pg_rewind from: it has
             completed a checkpoint on its current timeline, so its control file no
             longer advertises a stale checkpoint timeline. A diverged follower that
             rewinds before this is true copies the stale timeline into its own
             minRecoveryPoint and FATALs on startup. When the record's primary is this
             pooler itself, the value is computed live (checkpointed timeline == running
             timeline); for a follower it is the value most recently relayed via
             SetPrimary about the leader it follows.

             TODO: consider renaming to rewind_ready_through_coordinator_term int64
             (0 = not ready, >0 = the coordinator term through which readiness holds).
             The current bool is valid for the entire coordinator term and is
             invalidated only by a new promotion — encoding the term explicitly in the
             field name and value would make that scope self-documenting.
          title: rewind_ready
          type: boolean
      title: ReplicationPrimary
      type: object
    clustermetadata.RoutingRole:
      description: |-
        RoutingRole is a pooler's role for query ROUTING and HA purposes. It is about
         WRITABILITY, not consensus: PRIMARY means this pooler is the writable leader,
         REPLICA means it is not. This is deliberately distinct from consensus
         leadership (leader/follower, tracked in ConsensusStatus and rule history) and
         from postgres recovery mode (primary/standby). Consensus consumers
         (multiorch) must NOT read this — they read consensus state directly.
      enum:
        - ROUTING_ROLE_UNKNOWN
        - ROUTING_ROLE_PRIMARY
        - ROUTING_ROLE_REPLICA
      title: RoutingRole
      type: string
    clustermetadata.RoutingState:
      additionalProperties: false
      description: |-
        RoutingState is a pooler's self-reported routing/HA state: its writability
         role plus the rule that qualifies it. The pooler's identity is contextual (the
         enclosing Multipooler.id, or StreamPoolerHealthResponse.pooler_id) — a REPLICA
         never points at "the leader", so there is no leader_id here.

         It is carried in two places:
           - the pooler's own Multipooler topology record (routing_state field), so
             multigateway can bootstrap write routing from etcd at discovery time
             without relying on Multipooler.type as a hint. The multipooler's own
             publish path (pooler_record.go) drops rule for every role but PRIMARY,
             to avoid churning etcd on a replica's frequently-bumping advisory rule
             — see Multipooler.routing_state. A RoutingState built or read anywhere
             else is not subject to that omission and carries rule regardless of
             role; and
           - the multipooler health stream (StreamPoolerHealthResponse.routing_state),
             always populated with both fields, where role == PRIMARY is the writable
             signal.
      properties:
        role:
          $ref: '#/components/schemas/clustermetadata.RoutingRole'
          description: role is the writability routing role. role == PRIMARY is the writable signal.
          title: role
        rule:
          $ref: '#/components/schemas/clustermetadata.RuleNumber'
          description: |-
            rule qualifies the role, compared lexicographically over
             (coordinator_term, leader_subterm). For PRIMARY it is the committed,
             non-revoked rule naming this pooler (write authority; the gateway ranks
             competing PRIMARYs by it during the brief overlapping-failover window). For
             REPLICA it is the highest rule this pooler has known (advisory) — for a
             self-demoting stale primary, its last-known leadership rule. The
             multipooler's own topology-publish path (pooler_record.go) omits this for
             non-PRIMARY poolers — see Multipooler.routing_state — but that is specific
             to that path; the health stream always populates it, as does any other
             RoutingState.
          title: rule
      title: RoutingState
      type: object
    clustermetadata.RuleNumber:
      additionalProperties: false
      description: |-
        RuleNumber uniquely identifies a shard rule — the outcome of a coordinator
         writing a cluster state change to rule_history. Every change (promotion,
         cohort membership, durability policy) produces a new RuleNumber.

         Compared lexicographically: higher coordinator_term takes precedence; within
         the same coordinator_term, higher leader_subterm takes precedence. leader_subterm
         resets to 0 when coordinator_term increases, so subterms alone are not
         globally unique.
      properties:
        coordinatorTerm:
          pattern: ^-?[0-9]+$
          title: coordinator_term
          type: string
        leaderSubterm:
          pattern: ^-?[0-9]+$
          title: leader_subterm
          type: string
      title: RuleNumber
      type: object
    clustermetadata.RuleNumberPosition:
      additionalProperties: false
      description: |-
        RuleNumberPosition mirrors RulePosition but carries only rule numbers, not
         the full ShardRule (no leader, cohort, or durability policy) — for callers
         that only need to compare ordinal position, not a rule's full content.

         TODO: go/common/consensus.RuleNumberPosition (compare.go) is the same
         concept as a plain, non-serializable Go struct (it predates this message,
         deliberately not proto3 since nothing needed to serialize it). Consider
         unifying once something needs to compare or serialize this proto type —
         e.g. give this message a Compare method mirroring the Go struct's, or
         migrate the Go struct's usages onto this message and delete it.
      properties:
        decision:
          $ref: '#/components/schemas/clustermetadata.RuleNumber'
          title: decision
        proposal:
          $ref: '#/components/schemas/clustermetadata.RuleNumber'
          title: proposal
      title: RuleNumberPosition
      type: object
    clustermetadata.RulePosition:
      additionalProperties: false
      description: |-
        RulePosition is a pooler's logical position: the highest rule it has
         durably decided (marked committed), plus an optional proposal beyond it
         that has been written to local WAL but not yet marked decided. A proposal
         may already have reached quorum durability without this pooler (or the
         coordinator that wrote it) ever learning the outcome — for example if the
         writer crashed between the synchronous write completing and the decision
         being confirmed.

         Comparable independent of any specific point in physical time: prefer the
         higher rule (proposal if present, else decision), compared by
         (coordinator_term, leader_subterm).
      properties:
        decision:
          $ref: '#/components/schemas/clustermetadata.ShardRule'
          description: The highest shard rule this pooler has marked as decided.
          title: decision
        proposal:
          $ref: '#/components/schemas/clustermetadata.ShardRule'
          description: |-
            A shard rule this pooler has written to local WAL beyond its decision,
             not yet marked decided. Nil if there is no pending proposal. If non-empty,
             this rule must be greater than the decision.
          title: proposal
      title: RulePosition
      type: object
    clustermetadata.S3Backup:
      additionalProperties: false
      description: S3Backup stores backups in AWS S3 or S3-compatible storage
      properties:
        bucket:
          description: S3 bucket name (required)
          title: bucket
          type: string
        endpoint:
          description: |-
            Optional: S3-compatible endpoint URL (e.g., for s3mock testing)
             If empty, uses standard AWS S3 endpoint
          title: endpoint
          type: string
        keyPrefix:
          description: |-
            Optional: Key prefix within bucket (e.g., "multigres-prod/")
             Used to organize backups in shared buckets
          title: key_prefix
          type: string
        region:
          description: AWS region (required, e.g., "us-east-1")
          title: region
          type: string
        useEnvCredentials:
          description: |-
            If true, read AWS credentials from environment variables at runtime
             (AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY)
             pgbackrest config will use repo1-s3-key-type=shared with explicit credentials

             If false, use automatic credential detection via repo1-s3-key-type=auto
             (IRSA, EC2 metadata, etc.). This will only work when running on AWS.
          title: use_env_credentials
          type: boolean
      title: S3Backup
      type: object
    clustermetadata.ShardKey:
      additionalProperties: false
      description: |-
        ShardKey uniquely identifies a shard in the cluster.
         This is a centralized message used across all services to identify shards.
      properties:
        database:
          description: Database name.
          title: database
          type: string
        shard:
          description: Shard name. If range based sharding is used, it should match key_range.
          title: shard
          type: string
        tableGroup:
          description: TableGroup name.
          title: table_group
          type: string
      title: ShardKey
      type: object
    clustermetadata.ShardRule:
      additionalProperties: false
      description: |-
        ShardRule is the complete, authoritative description of shard state at a
         specific rule number. Leader identity, cohort membership, and durability
         policy are only meaningful together and relative to the rule that established
         them.
      properties:
        cohortMembers:
          items:
            $ref: '#/components/schemas/clustermetadata.ID'
          title: cohort_members
          type: array
        coordinatorId:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: Which coordinator or pooler facilitated applying the rule.
          title: coordinator_id
        creationTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: |-
            At what time the coordinator or pooler began trying to apply the rule,
             from the coordinator's perspective.
          title: creation_time
        durabilityPolicy:
          $ref: '#/components/schemas/clustermetadata.DurabilityPolicy'
          description: What nodes need to acknowledge a write before it's considered durable.
          title: durability_policy
        leaderId:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: |-
            The consensus leader for this rule, through which all transactions (including rules) are
             written to the WAL.
          title: leader_id
        ruleNumber:
          $ref: '#/components/schemas/clustermetadata.RuleNumber'
          title: rule_number
      title: ShardRule
      type: object
    clustermetadata.TermRevocation:
      additionalProperties: false
      description: |-
        TermRevocation records that this pooler has revoked participation in all terms
         strictly below revoked_below_term. Two things are revoked:

          1. Consensus participation: the pooler will refuse Recruit or other coordinator
             requests for any term < revoked_below_term, and for revoked_below_term itself
             from a different coordinator than accepted_coordinator_id.

          2. Replication participation: a revoked primary must stop accepting writes; a
             revoked replica must clear primary_conninfo. Replication participation resumes
             once the pooler's highest known rule reaches or exceeds revoked_below_term
             (i.e. the rule for that term has replicated through).
             TODO: It's currently technically possible to begin a term without revoking
             replication, but we plan to remove that capability and this message is named
             for what we intend to do rather than what we currently do.

         Re-sending an identical recruitment is idempotent. A higher-term recruitment
         supersedes lower ones automatically.

         Persisted to local disk before responding; survives process restarts.
      properties:
        acceptedCoordinatorId:
          $ref: '#/components/schemas/clustermetadata.ID'
          description: |-
            The coordinator (multiorch instance) that recruited this revocation.
             Retained for idempotency: the same coordinator at the same term is re-accepted;
             a different coordinator at the same term is refused.
          title: accepted_coordinator_id
        coordinatorInitiatedAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: |-
            When the coordinator created this term, set by the coordinator before
             recruiting. All poolers that accept the same recruitment store the same value.
             TODO: populate once RecruitRequest carries this timestamp.
          title: coordinator_initiated_at
        outgoingRule:
          $ref: '#/components/schemas/clustermetadata.RuleNumber'
          description: |-
            The rule the coordinator observed across the cohort at recruit time —
             the "from" side of the transition this recruit was authoring. Used as
             an override key during SetPrimary: if a subsequent SetPrimary carries a rule
             strictly greater than this, the cluster has demonstrably moved past
             the runaway recruit's premise and the revocation is moot.
          title: outgoing_rule
        recruitIntent:
          $ref: '#/components/schemas/clustermetadata.RecruitIntent'
          description: |-
            The coordinator's intent/context for this recruitment. Today it carries the
             collective failover-backoff accounting; it may grow to hold other
             recruit-scoped information over time.
          title: recruit_intent
        revokedBelowTerm:
          description: |-
            All terms strictly below this value are revoked. The pooler has accepted
             the coordinator's exclusive right to act at this term.
          pattern: ^-?[0-9]+$
          title: revoked_below_term
          type: string
      title: TermRevocation
      type: object
    google.protobuf.Any:
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
      properties:
        '@type':
          description: A URL/resource name that uniquely identifies the type of the serialized message.
          type: string
      type: object
    google.protobuf.Duration:
      description: |-
        A Duration represents a signed, fixed-length span of time represented
         as a count of seconds and fractions of seconds at nanosecond
         resolution. It is independent of any calendar and concepts like "day"
         or "month". It is related to Timestamp in that the difference between
         two Timestamp values is a Duration and it can be added or subtracted
         from a Timestamp. Range is approximately +-10,000 years.

         # Examples

         Example 1: Compute Duration from two Timestamps in pseudo code.

             Timestamp start = ...;
             Timestamp end = ...;
             Duration duration = ...;

             duration.seconds = end.seconds - start.seconds;
             duration.nanos = end.nanos - start.nanos;

             if (duration.seconds < 0 && duration.nanos > 0) {
               duration.seconds += 1;
               duration.nanos -= 1000000000;
             } else if (duration.seconds > 0 && duration.nanos < 0) {
               duration.seconds -= 1;
               duration.nanos += 1000000000;
             }

         Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.

             Timestamp start = ...;
             Duration duration = ...;
             Timestamp end = ...;

             end.seconds = start.seconds + duration.seconds;
             end.nanos = start.nanos + duration.nanos;

             if (end.nanos < 0) {
               end.seconds -= 1;
               end.nanos += 1000000000;
             } else if (end.nanos >= 1000000000) {
               end.seconds += 1;
               end.nanos -= 1000000000;
             }

         Example 3: Compute Duration from datetime.timedelta in Python.

             td = datetime.timedelta(days=3, minutes=10)
             duration = Duration()
             duration.FromTimedelta(td)

         # JSON Mapping

         In JSON format, the Duration type is encoded as a string rather than an
         object, where the string ends in the suffix "s" (indicating seconds) and
         is preceded by the number of seconds, with nanoseconds expressed as
         fractional seconds. For example, 3 seconds with 0 nanoseconds should be
         encoded in JSON format as "3s", while 3 seconds and 1 nanosecond should
         be expressed in JSON format as "3.000000001s", and 3 seconds and 1
         microsecond should be expressed in JSON format as "3.000001s".
      pattern: ^-?[0-9]+(\.[0-9]{1,9})?s$
      type: string
    google.protobuf.Timestamp:
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      type: string
