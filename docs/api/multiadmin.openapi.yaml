info:
  description: |-
    Administrative REST API for open-source Multigres clusters, served by the Vanguard transcoder. Use the HTTP address of your multiadmin instance as the base URL. Bearer JWT authentication is enforced when multiadmin runs with --enable-auth. JSON uses camelCase field names, string enum names, decimal strings for 64-bit integers, RFC 3339 timestamps, and protobuf durations such as 1.500s. Default-valued fields may be omitted.

    Errors use google.rpc.Status JSON: code is a numeric gRPC code (not the HTTP status), message is diagnostic text, and details contains typed objects with an @type field. Use the numeric code together with the operation's error and recovery guidance; current handlers do not consistently preserve dependency failures. The Connect adapter currently discards gRPC status details, including mtrpc.RPCError application codes. Clients must tolerate missing details and must not parse diagnostic messages as stable error identifiers. HTTP mappings: 400 InvalidArgument/FailedPrecondition/OutOfRange; 401 Unauthenticated; 403 PermissionDenied; 404 NotFound; 409 AlreadyExists/Aborted; 429 ResourceExhausted; 499 Canceled; 500 Unknown/Internal/DataLoss; 501 Unimplemented; 503 Unavailable; 504 DeadlineExceeded. Proxy or routing errors can have non-JSON bodies; inspect Content-Type.

    Error handling: InvalidArgument (3) requires a corrected request; FailedPrecondition (9) requires a change in cluster state. Both use HTTP 400. NotFound (5) normally indicates absence, but backup lookups can also return it when a pooler could not be queried. Unavailable (14) and DeadlineExceeded (4) can reflect dependency failures; reads can retry with bounded backoff. Internal (13) and Unknown (2) can mask downstream failures. See each operation for exceptions.

    Mutation errors, timeouts, and lost responses do not guarantee rollback. Reconcile cluster state before retrying rule changes or switchovers. Backup creation success means a job was accepted; poll job status for its eventual outcome.
