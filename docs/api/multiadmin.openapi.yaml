          description: p50_ms_trend holds p50 latency (ms) samples over time.
          items:
            format: double
            type: number
          title: p50_ms_trends
          type: array
        p99Duration:
          $ref: '#/components/schemas/google.protobuf.Duration'
          description: |-
            p99_duration is the 99th-percentile execution duration computed from the
             per-fingerprint histogram.
          title: p99_duration
        p99MsTrends:
          description: p99_ms_trend holds p99 latency (ms) samples over time.
          items:
            format: double
            type: number
          title: p99_ms_trends
          type: array
        rowsRateTrends:
          description: rows_rate_trend holds rows-per-second samples over time.
          items:
            format: double
            type: number
          title: rows_rate_trends
          type: array
        sampleInterval:
          $ref: '#/components/schemas/google.protobuf.Duration'
          description: |-
            sample_interval is the cadence at which the trend slices below were
             captured. Empty when trend sampling is disabled.
          title: sample_interval
        totalDuration:
          $ref: '#/components/schemas/google.protobuf.Duration'
          description: |-
            total_duration is the cumulative wall-clock time spent executing this
             fingerprint's queries.
          title: total_duration
        totalRows:
          description: total_rows is the cumulative row count returned across all executions.
          pattern: ^[0-9]+$
          title: total_rows
          type: string
        totalTimeMsTrends:
          description: total_time_ms_trend holds duration-ms-per-second-of-wall-clock samples.
          items:
            format: double
            type: number
          title: total_time_ms_trends
          type: array
      title: QueryStatSnapshot
      type: object
    multipoolermanagerdata.PostgresAction:
      description: PostgresAction identifies a long-running postgres manager operation.
      enum:
        - POSTGRES_ACTION_UNSPECIFIED
        - POSTGRES_ACTION_STARTING
        - POSTGRES_ACTION_RESTORING_FROM_BACKUP
        - POSTGRES_ACTION_CREATING_FIRST_BACKUP
      title: PostgresAction
      type: string
    multipoolermanagerdata.PostgresStatus:
      description: |-
        PostgresStatus is the observed state of the PostgreSQL server process.
         This reflects what postgres actually is right now and may differ from
         PoolerType during transitions (e.g. a REPLICA pooler in PROMOTING state).
      enum:
        - POSTGRES_STATUS_UNKNOWN
        - POSTGRES_STATUS_STARTING
        - POSTGRES_STATUS_STANDBY
        - POSTGRES_STATUS_PROMOTING
        - POSTGRES_STATUS_PRIMARY
      title: PostgresStatus
      type: string
    multipoolermanagerdata.PrimaryConnInfo:
      additionalProperties: false
      description: Primary connection information parsed from PostgreSQL's primary_conninfo setting
      properties:
        applicationName:
          description: Application name for this standby
          title: application_name
          type: string
        dbname:
          description: |-
            Database name for the replication connection (dbname=). Required by the
             PostgreSQL 17 slot-sync worker, which opens an ordinary SQL connection to
             the primary to synchronize failover slots; ignored by physical streaming
             replication.
          title: dbname
          type: string
        host:
          description: Primary server hostname
          title: host
          type: string
        passfile:
          description: |-
            Path to the libpq password file (passfile=) the standby uses to
             authenticate to the primary. Empty when the conninfo carries no passfile
             clause. Not a secret (it is a filesystem path, not the password itself).
          title: passfile
          type: string
        port:
          description: Primary server port
          format: int32
          title: port
          type: integer
        raw:
          description: Raw connection string (includes all parameters)
          title: raw
          type: string
        user:
          description: Database user for replication connection
          title: user
          type: string
      title: PrimaryConnInfo
      type: object
    multipoolermanagerdata.PrimaryStatus:
      additionalProperties: false
      description: PostgreSQL primary server status
      properties:
        connectedFollowers:
          description: |-
            Follower servers that are currently connected to the primary (parsed from pg_stat_replication).
             This only includes followers that have an active replication connection, not all configured standbys.
          items:
            $ref: '#/components/schemas/clustermetadata.ID'
          title: connected_followers
          type: array
        lsn:
          description: 'Current WAL LSN position (PostgreSQL format: X/XXXXXXXX)'
          title: lsn
          type: string
        maxWalSenders:
          description: |-
            Maximum number of WAL sender processes the primary allows (the
             max_wal_senders setting). Surfacing this alongside connected_followers makes
             wal-sender capacity exhaustion visible: once connected_followers reaches
             max_wal_senders, additional standbys cannot stream.
          format: int32
          title: max_wal_senders
          type: integer
        quorumCommitLsn:
          title: quorum_commit_lsn
          type: string
        quorumCommitTs:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: |-
            The leader's own first-hand view of quorum_commit_ts/quorum_commit_lsn
             (its heartbeat writer's last proven-quorum-acked write), mirroring the
             same-named fields on StandbyReplicationStatus. Available even when no
             follower is reachable to relay the replicated heartbeat row. Null/empty
             if the writer hasn't observed a value yet.
          title: quorum_commit_ts
        ready:
          description: Whether server is accepting connections
          title: ready
          type: boolean
        syncReplicationConfig:
          $ref: '#/components/schemas/multipoolermanagerdata.SynchronousReplicationConfiguration'
          description: Synchronous replication configuration (parsed from synchronous_standby_names and synchronous_commit)
          title: sync_replication_config
      title: PrimaryStatus
      type: object
    multipoolermanagerdata.StandbyReplicationStatus:
      additionalProperties: false
      description: StandbyReplicationStatus PostgreSQL replication status information
      properties:
        isWalReplayPaused:
          description: Result of pg_is_wal_replay_paused()
          title: is_wal_replay_paused
          type: boolean
        lag:
          $ref: '#/components/schemas/google.protobuf.Duration'
          description: Replication lag (optional, may not always be available)
          title: lag
        lastMsgReceiveTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: |-
            Last time the standby received a message (WAL or keepalive) from the
             primary. From pg_stat_wal_receiver.last_msg_receive_time. Null if WAL
             receiver is not running.
          title: last_msg_receive_time
        lastReceiveLsn:
          description: |-
            Last WAL position received and synced to disk by standby (PostgreSQL format: X/XXXXXXXX)
             Obtained from pg_last_wal_receive_lsn()
          title: last_receive_lsn
          type: string
        lastReceiveLsnAdvanceTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: |-
            When last_receive_lsn (pg_last_wal_receive_lsn — WAL streamed from the
             primary) last increased, as observed by the standby's heartbeat reader on
             its regular tick. This is a WAL-*progress* signal, distinct from
             last_msg_receive_time (which advances on keepalives with no new WAL). It is
             unaffected by restore_command/archive replay, which advances replay_lsn but
             not receive_lsn — so a fresh value means the leader is actively streaming new
             WAL to this standby. Null if the reader has not yet observed a value.
          title: last_receive_lsn_advance_time
        lastReplayLsn:
          description: |-
            Last WAL position replayed during recovery (PostgreSQL format: X/XXXXXXXX)
             Obtained from pg_last_wal_replay_lsn()
          title: last_replay_lsn
          type: string
        lastXactReplayTimestamp:
          description: Result of pg_last_xact_replay_timestamp()
          title: last_xact_replay_timestamp
          type: string
        primaryConnInfo:
          $ref: '#/components/schemas/multipoolermanagerdata.PrimaryConnInfo'
          description: Primary connection info parsed from primary_conninfo setting
          title: primary_conn_info
        quorumCommitLsn:
          description: |-
            The heartbeat table's quorum_commit_lsn, paired with quorum_commit_ts.
             Empty if unobserved.
          title: quorum_commit_lsn
          type: string
        quorumCommitTs:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: |-
            Leader-stamped time of the last heartbeat write proven quorum-acked. A
             stale value while last_receive_lsn keeps advancing means quorum commits
             have stalled even though WAL is still streaming. Null if unobserved.
          title: quorum_commit_ts
        walReceiverStatus:
          description: |-
            WAL receiver status from pg_stat_wal_receiver.status
             Values: "streaming", "stopping", "starting", "waiting", or empty if no WAL receiver
             Empty string indicates WAL receiver is not running (0 rows from pg_stat_wal_receiver)
          title: wal_receiver_status
          type: string
        walReceiverStatusInterval:
          $ref: '#/components/schemas/google.protobuf.Duration'
          description: |-
            How often the standby sends status messages to the primary.
             From current_setting('wal_receiver_status_interval').
             Used to derive the heartbeat staleness threshold dynamically.
          title: wal_receiver_status_interval
        walReceiverTimeout:
          $ref: '#/components/schemas/google.protobuf.Duration'
          description: |-
            How long the standby waits without receiving a message from the primary
             before terminating the WAL receiver connection.
             From current_setting('wal_receiver_timeout').
          title: wal_receiver_timeout
        walReplayPauseState:
          description: Result of pg_get_wal_replay_pause_state()
          title: wal_replay_pause_state
          type: string
      title: StandbyReplicationStatus
      type: object
    multipoolermanagerdata.Status:
      additionalProperties: false
      description: |-
        Status provides unified status information that works for both PRIMARY and REPLICA poolers.
         This RPC works even when the database connection is unavailable - fields that require
         database access will be nil/empty in that case.
      properties:
        failoverSlotsReady:
          description: |-
            Failover logical replication slots on this node: failover_slots_ready is the
             number that are failover-ready (synced, not temporary, not invalidated) and
             failover_slots_total is how many exist. Populated only when slot-based
             replication is enabled; both zero otherwise. Multiorch uses
             failover_slots_ready as a tiebreaker among equally-WAL-advanced promotion
             candidates, so a failover prefers a node that keeps the most subscribers
             resumable.
          format: int32
          title: failover_slots_ready
          type: integer
        failoverSlotsTotal:
          format: int32
          title: failover_slots_total
          type: integer
        hasDataDirectory:
          description: Whether data directory exists
          title: has_data_directory
          type: boolean
        isInitialized:
          description: Whether this pooler has been initialized (has data directory and multigres schema)
          title: is_initialized
          type: boolean
        poolerType:
          $ref: '#/components/schemas/clustermetadata.PoolerType'
          description: Pooler type from topology (PRIMARY or REPLICA)
          title: pooler_type
        postgresAction:
          $ref: '#/components/schemas/multipoolermanagerdata.PostgresAction'
          description: |-
            Current long-running postgres action in progress, if any.
             UNSPECIFIED means no action is running (postgres is idle or already running).
          title: postgres_action
        postgresActionDuration:
          $ref: '#/components/schemas/google.protobuf.Duration'
          description: |-
            How long the current action has been running.
             Only meaningful when postgres_action != UNSPECIFIED.
          title: postgres_action_duration
        postgresReady:
          description: |-
            Whether PostgreSQL is currently running and accepting connections (pg_isready passed).
             This is the combined check: process must exist AND respond to pg_isready.
             Use postgres_running to check only if the process exists.
          title: postgres_ready
          type: boolean
        postgresRunning:
          description: |-
            Whether the PostgreSQL process exists (regardless of whether it accepts connections).
             True if the postgres process is running (e.g. SIGSTOP'd postgres: process exists but
             pg_isready fails). False if the process is dead (e.g. after SIGKILL).
             Use this to distinguish a temporarily-unresponsive postgres (SIGSTOP) from a dead
             postgres (SIGKILL) when postgres_ready is false.
          title: postgres_running
          type: boolean
        postgresStatus:
          $ref: '#/components/schemas/multipoolermanagerdata.PostgresStatus'
          description: |-
            Observed state of the PostgreSQL server process. This reflects what postgres
             actually is right now and may differ from pooler_type during transitions.
          title: postgres_status
        primaryStatus:
          $ref: '#/components/schemas/multipoolermanagerdata.PrimaryStatus'
          description: Primary status information (only populated if pooler is acting as primary AND db is connected)
          title: primary_status
        replicationStatus:
          $ref: '#/components/schemas/multipoolermanagerdata.StandbyReplicationStatus'
          description: Replication status information (only populated if pooler is acting as standby AND db is connected)
          title: replication_status
        shardId:
          description: Shard ID that this pooler belongs to
          title: shard_id
          type: string
        walPosition:
          description: Current WAL position (empty if db not connected)
          title: wal_position
          type: string
      title: Status
      type: object
    multipoolermanagerdata.SynchronousCommitLevel:
      description: Synchronous commit level
      enum:
        - SYNCHRONOUS_COMMIT_OFF
        - SYNCHRONOUS_COMMIT_LOCAL
        - SYNCHRONOUS_COMMIT_REMOTE_WRITE
        - SYNCHRONOUS_COMMIT_ON
        - SYNCHRONOUS_COMMIT_REMOTE_APPLY
      title: SynchronousCommitLevel
      type: string
    multipoolermanagerdata.SynchronousMethod:
      description: Synchronization method for standby servers
      enum:
        - SYNCHRONOUS_METHOD_UNSPECIFIED
        - SYNCHRONOUS_METHOD_FIRST
        - SYNCHRONOUS_METHOD_ANY
      title: SynchronousMethod
      type: string
    multipoolermanagerdata.SynchronousReplicationConfiguration:
      additionalProperties: false
      description: Synchronous replication configuration
      properties:
        numSync:
          description: Number of synchronous standbys
          format: int32
          title: num_sync
          type: integer
        standbyApplicationNames:
          description: |-
            Application names for standbys in standby_ids (format: {cell}_{name}).
             Parallel to standby_ids: standby_application_names[i] is the application name for standby_ids[i].
          items:
            type: string
          title: standby_application_names
          type: array
        standbyIds:
          description: List of standby IDs that can participate in synchronous replication
          items:
            $ref: '#/components/schemas/clustermetadata.ID'
          title: standby_ids
          type: array
        synchronousCommit:
          $ref: '#/components/schemas/multipoolermanagerdata.SynchronousCommitLevel'
          description: Synchronous commit level
          title: synchronous_commit
        synchronousMethod:
          $ref: '#/components/schemas/multipoolermanagerdata.SynchronousMethod'
          description: Synchronous method (FIRST or ANY)
          title: synchronous_method
      title: SynchronousReplicationConfiguration
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: 'Send Authorization: Bearer <JWT> when --enable-auth is enabled.'
      scheme: bearer
      type: http
