[global]
log-path={{.LogPath}}
# spool-path is only used by asynchronous archiving. For archive-push it holds
# per-segment acknowledgement files (bytes each); WAL itself stays in pg_wal
# until pgbackrest has written it to the repo. For archive-get it holds
# prefetched WAL, bounded by archive-get-queue-max (default 128MiB).
spool-path={{.SpoolPath}}
lock-path={{.LockPath}}
# Asynchronous archiving: one long-lived archive-push process drains
# pg_wal/archive_status in parallel (archive-push process-max workers) over a
# reused repo connection instead of one process, connection and archive.info
# read per segment. postgres is still only told a segment is archived after
# it is in the repo. archive-push-queue-max must stay unset: with a limit
# pgbackrest acknowledges and DROPS WAL once the backlog exceeds it, which
# breaks PITR. With more than one repo async is also what keeps a down repo
# from holding the healthy ones one segment behind.
archive-async=y
archive-copy=y
compress-type=zst
expire-auto=y
link-all=y
log-level-console=info
log-level-file=detail
log-subprocess=y
resume=n
start-fast=y
process-max={{.ProcessLimits.Global}}
{{- range $key, $value := .RetentionConfig}}
{{$key}}={{$value}}
{{- end}}

{{- if .RepoCredentials}}
{{- range $key, $value := .RepoCredentials}}
{{$key}}={{$value}}
{{- end}}
{{- end}}

[global:archive-get]
process-max={{.ProcessLimits.Get}}

[global:archive-push]
process-max={{.ProcessLimits.Push}}

[multigres]
{{range $key, $value := .RepoConfig}}{{$key}}={{$value}}
{{end}}
pg1-socket-path={{.Pg1SocketPath}}
pg1-port={{.Pg1Port}}
pg1-path={{.Pg1Path}}
pg1-user={{.Pg1User}}
pg1-database=postgres

[multigres:backup]
process-max={{.ProcessLimits.Backup}}

# pg2 configuration is not included in this template because it varies by backup.
# For replica backups, multipooler passes pg2 parameters (--pg2-host, --pg2-port,
# --pg2-host-type=tls) as CLI arguments to enable backup from primary via TLS server.
# Primary backups don't need pg2 - pgBackRest does local backup from pg1.
