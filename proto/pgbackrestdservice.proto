syntax = "proto3";

package pgbackrestdservice;

option go_package = "github.com/multigres/multigres/go/pb/pgbackrestdservice";

service PgBackRestd {
  // Configure sets the repository generation list. Rejected when revision is lower than the one held.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // Run executes one allowlisted pgBackRest command, streaming output; the last message carries the exit code.
  rpc Run(RunRequest) returns (stream RunOutput);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message RepoGeneration {
  uint32 generation = 1;
  uint32 repo_number = 2;
}

message ConfigureRequest {
  int64 revision = 1;
  repeated RepoGeneration repos = 2;
  uint32 wal_segment_size_bytes = 3;
}

message ConfigureResponse {
  bool accepted = 1;
  int64 held_revision = 2;
}

enum Command {
  COMMAND_UNSPECIFIED = 0;
  COMMAND_BACKUP = 1;
  COMMAND_VERIFY = 2;
  COMMAND_INFO = 3;
  COMMAND_CHECK = 4;
  COMMAND_EXPIRE = 5;
  COMMAND_STANZA_CREATE = 6;
  COMMAND_RESTORE = 7;
}

message RunRequest {
  Command command = 1;
  repeated string args = 2;
}

message RunOutput {
  oneof chunk {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
  // Set on the final message when output was dropped because the reader fell
  // behind. Only restore drops output; every other command blocks instead.
  bool output_truncated = 4;
}

message StatusRequest {
}

message StatusResponse {
  bool configured = 1;
  int64 revision = 2;
  repeated RepoGeneration repos = 3;
  repeated uint32 generations_with_keys = 4;
  bool server_up = 5;
  uint32 server_port = 6;
  string pgbackrest_version = 7;
  string location_fingerprint = 8;
  // Why a persisted configuration was set aside at startup; empty when none was.
  string state_error = 9;
  // True while a start that clears the stop file after a restore is still being retried.
  bool restore_start_pending = 10;
  // Fingerprint of the cipher key for each generation that has one, computed
  // like pgbackrest_repos.key_fingerprint so a caller can record it without
  // ever holding the key.
  map<uint32, string> generation_fingerprints = 11;
  // True from the moment a restore starts quiescing until its gate reopens
  // (the background start retry is reported by restore_start_pending instead).
  // A restore keeps running after the Run call that began it has failed or
  // been abandoned, so a caller must not touch the data directory while this
  // is set.
  bool restore_in_progress = 12;
  // True when the most recent restore in this sidecar's lifetime finished with
  // exit code 0. False before any restore, after a failed or timed-out one, and
  // after a sidecar restart.
  bool last_restore_succeeded = 13;
  // Commands of the Command enum that are running or are still being killed
  // and reaped, one entry per run (a command running twice appears twice). An
  // entry stays until the run's whole process group is gone, so a caller that
  // cancelled a Run can wait for its command to disappear and know pgBackRest's
  // lock is free. Restore appears here too.
  repeated Command active_commands = 14;
}
