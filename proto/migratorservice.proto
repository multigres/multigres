syntax = "proto3";

package migrator;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/multigres/multigres/go/pb/migrator";

// MigrationPhase is the lifecycle phase of a migration workflow.
enum MigrationPhase {
  MIGRATION_PHASE_UNSPECIFIED = 0;
  MIGRATION_PHASE_CREATED = 1;
  MIGRATION_PHASE_VALIDATING = 2;
  MIGRATION_PHASE_SCHEMA_COPY = 3;
  MIGRATION_PHASE_CREATE_PUBLICATION = 4;
  MIGRATION_PHASE_COPYING = 5;
  MIGRATION_PHASE_DROPPED = 6;
  MIGRATION_PHASE_FAILED = 7;
  MIGRATION_PHASE_COMPLETING = 8;
  // IMPORTING/EXPORTING are the caught-up steady states (importing from / serving
  // and exporting to the external database). SWITCHING_TO_* are the transient
  // cutover (to export) and roll-back (to import). STREAMING/SWITCHING (the
  // original, non-directional phases) were split into these so the phase
  // records the direction and, mid-switch, the target it is heading to (its
  // intent) — which makes a mid-switch failover resumable.
  MIGRATION_PHASE_IMPORTING = 9;
  MIGRATION_PHASE_EXPORTING = 10;
  MIGRATION_PHASE_SWITCHING_TO_IMPORT = 11;
  MIGRATION_PHASE_SWITCHING_TO_EXPORT = 12;
}

// MigrationDirection is which side is currently the publisher.
enum MigrationDirection {
  MIGRATION_DIRECTION_UNSPECIFIED = 0;
  // IMPORT: the external old database is the source (old DB -> Multigres).
  MIGRATION_DIRECTION_IMPORT = 1;
  // EXPORT: Multigres is the source (Multigres -> old DB), for fail-back.
  MIGRATION_DIRECTION_EXPORT = 2;
}

// TableSpec selects tables for a migration, mirroring one CREATE PUBLICATION
// "FOR TABLE" entry. qualified_names are the (optionally schema-qualified)
// table names ("schema.table").
message TableSpec {
  repeated string qualified_names = 1;
}

// SchemaSpec selects tables in a schema rather than tables and matches
// FOR TABLES IN SCHEMA name [, ...] construction.
message SchemaSpec {
  repeated string schemata = 1;
}

// SelectionObject is one entry in a migration's table selection: either a table
// (optionally with per-table clauses, see TableSpec) or a whole schema. Schema
// selection is a SNAPSHOT of the tables owned by the source role in that schema
// at create time — tables added to the schema later are NOT auto-included
// (native dynamic FOR TABLES IN SCHEMA would require superuser on the source).
message SelectionObject {
  oneof object {
    TableSpec table = 1;
    SchemaSpec schema = 2;
    bool all = 3;
  }
}

// Migration is the static, immutable configuration of a migration workflow —
// everything a caller supplies in CreateMigrationRequest. Live state (phase,
// progress, errors) is reported separately by MigrationStatus.
message Migration {
  int64 id = 1;
  // name is the optional, human-friendly identifier, unique per target database.
  // Empty for migrations created without one. The generated id remains the stable
  // internal key.
  string name = 2;
  // connection_name is the name of the stored Connection this migration reads
  // its source DSN from, live, for as long as the migration exists (see
  // Connection) — required, every migration has one. This is a standing
  // reference, not a one-time copy: altering the named connection (or
  // switching a migration to a different one via UpdateMigration, field-masked
  // as "connection_name") takes effect on the migration's very next action,
  // not just at create time.
  string connection_name = 3;
  string target_database = 4;
  string target_shard = 5;
  SelectionObject objects = 6;
  // sequence_margin is added past each sequence's max at a direction switch.
  // Set at create time; changeable afterward via UpdateMigration.
  int64 sequence_margin = 7;
}

// MigrationStatus is the live, observed state of a migration workflow:
// everything that changes after creation. Every RPC that hands back a
// migration returns both it and the migration's static Migration.
message MigrationStatus {
  int64 id = 1;
  MigrationPhase phase = 2;
  // last_error is the failure reason, set when phase is FAILED.
  string last_error = 3;
  // total_relations / ready_relations report initial-copy progress (srsubstate).
  int64 total_relations = 4;
  int64 ready_relations = 5;
  bool caught_up = 6;
  string publication_name = 7;
  string subscription_name = 8;
  google.protobuf.Timestamp created_at = 9;
  // active_direction is which side is currently the publisher.
  MigrationDirection active_direction = 10;
  // streaming_since is set when the migration first reaches STREAMING.
  google.protobuf.Timestamp streaming_since = 11;
  // lag_bytes / lag_seconds are the live replication lag measured on the current
  // publisher (the external source in IMPORT, the Multigres target in EXPORT):
  // lag_bytes = pg_current_wal_lsn() - confirmed_flush_lsn, lag_seconds = the
  // walsender's replay_lag. Both are 0 when the migration is not streaming or the
  // lag cannot be read. lag_bytes is the same measure ActivateMigration.max_lag_bytes
  // gates on.
  uint64 lag_bytes = 12;
  double lag_seconds = 13;
}

// MigrationJournalEntry is one row of a migration's durable, append-only audit
// log (multigres.migration_journal): each lifecycle action (create, start, phase
// advance, direction switch, drop, failure) appends one entry. It is an internal
// audit surface — never contains credentials — and, unlike the Migration
// projection, is retained after the migration is dropped.
message MigrationJournalEntry {
  // seq is the database-generated global monotonic audit order.
  int64 seq = 1;
  int64 migration_id = 2;
  // migration_name is the migration's optional name, denormalized at write time
  // so the entry stays readable after the migration row is dropped.
  string migration_name = 3;
  // event is the action: CREATE, START, PHASE, ACTIVATE, DEACTIVATE, DROP, FAILED.
  string event = 4;
  // phase is the migration phase in effect at (or resulting from) the action.
  MigrationPhase phase = 5;
  // direction is the active replication direction at the action.
  MigrationDirection direction = 6;
  // from_lsn is the drained-to / quiesce LSN on the old writer (direction switch
  // and graceful drop); empty otherwise.
  string from_lsn = 7;
  // to_lsn is the start LSN on the new writer (direction switch); empty otherwise.
  string to_lsn = 8;
  // last_error is the failure reason (FAILED entries).
  string last_error = 9;
  // detail is free-form context, e.g. "COPYING->IMPORTING" for a phase advance.
  string detail = 10;
  google.protobuf.Timestamp created_at = 11;
}

// GetMigrationJournalRequest addresses one migration by id or, when id is empty,
// by name. A dropped migration is addressable only by id (the row that carried
// the name is gone, though its journal entries are retained).
message GetMigrationJournalRequest {
  int64 id = 1;
  string name = 2;
}
message GetMigrationJournalResponse {
  // entries are the migration's journal entries, oldest first.
  repeated MigrationJournalEntry entries = 1;
}

message CreateMigrationRequest {
  Migration migration = 1;
  // skip_copy_data skips the initial COPY at subscription setup (the data is
  // assumed to be seeded out-of-band). false (the default) performs the
  // initial COPY.
  bool skip_copy_data = 7;
  // skip_schema_copy skips the pg_dump --schema-only step (target schema exists).
  bool skip_schema_copy = 8;
  // quiesce_roles are optional application role names on the source whose CONNECT
  // privilege is revoked during the ACTIVATE cutover (and restored on a deactivate
  // rollback or teardown), so they cannot reconnect and write to the source once it
  // becomes a subscriber. The hard quiesce always freezes and terminates existing
  // client backends; naming roles here additionally fences reconnects that would
  // otherwise diverge. Each role must exist on the source and must not be the DSN's
  // own role (validated at create time). Empty leaves the terminate + read-only
  // barrier as the only guard.
  repeated string quiesce_roles = 9;
}
message CreateMigrationResponse {
  Migration migration = 1;
  MigrationStatus status = 2;
}

// UpdateMigrationRequest changes mutable fields; only fields named in
// update_mask are applied. Mask paths are relative to migration (the Google
// API Design Guide convention), e.g. "connection_name", "sequence_margin",
// or (only while CREATED) "objects". migration.id or migration.name
// (whichever is set) addresses the migration being updated.
message UpdateMigrationRequest {
  Migration migration = 3;
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateMigrationResponse {
  Migration migration = 1;
  MigrationStatus status = 2;
}

// MigrationRef addresses one migration: by id, or by its unique name.
message MigrationRef {
  oneof ref {
    int64 id = 1;
    string name = 2;
  }
}

// ActivateMigrationRequest cuts the migration over to serving: drain to lag zero,
// switch to the EXPORT direction, and start serving. Requires the current
// direction to be IMPORT.
message ActivateMigrationRequest {
  MigrationRef ref = 1;
  // max_lag_bytes is the readiness threshold for the cutover. Before quiescing the
  // source, activation polls the live replication lag (the bytes of source WAL the
  // target has not yet confirmed-consumed) and proceeds only once it is at or below
  // this many bytes, so the residual drain under the read-only barrier completes
  // inside the gateway's failover-buffer window (queries buffered during the cutover
  // are replayed, not refused). 0 uses the server default. Choosing it too large
  // relative to the gateway buffer window risks the buffer overflowing mid-cutover;
  // keeping it small enough is the operator's responsibility (not enforced here).
  optional uint64 max_lag_bytes = 2;
  // wait_timeout_seconds bounds how long activation blocks waiting for the lag to
  // fall to max_lag_bytes. 0 uses the server default. If the threshold is not
  // reached within the timeout, activation fails with a precondition error and the
  // migration stays in the IMPORT direction (no cutover, no serving change).
  optional int64 wait_timeout_seconds = 3;
}
message ActivateMigrationResponse {
  Migration migration = 1;
  MigrationStatus status = 2;
}
// DeactivateMigrationRequest rolls the migration back to non-serving: stop
// serving, then switch back to the IMPORT direction. Requires the current
// direction to be EXPORT.
message DeactivateMigrationRequest {
  MigrationRef ref = 1;
}
message DeactivateMigrationResponse {
  Migration migration = 1;
  MigrationStatus status = 2;
}

// StartMigrationRequest is addressed by ref (id or name).
message StartMigrationRequest {
  MigrationRef ref = 1;
}
message StartMigrationResponse {
  Migration migration = 1;
  MigrationStatus status = 2;
}

// GetMigrationRequest addresses one migration by ref (id or name).
message GetMigrationRequest {
  MigrationRef ref = 1;
}
message GetMigrationResponse {
  Migration migration = 1;
  MigrationStatus status = 2;
}

// ListMigrationsRequest lists the ids of every migration. At most one
// migration exists at a time today, so this returns 0 or 1 ids; fetch full
// details for each via GetMigration.
message ListMigrationsRequest {
}
message ListMigrationsResponse {
  repeated int64 ids = 1;
}

// DropMigrationRequest is addressed by ref (id or name).
message DropMigrationRequest {
  MigrationRef ref = 1;
  // wait blocks until the migration reaches a completable (caught-up) state,
  // then drains and tears down. Mutually exclusive with force.
  bool wait = 2;
  // wait_timeout_seconds bounds wait (0 = no timeout).
  int64 wait_timeout_seconds = 3;
  // force skips the drain and tears down from any phase.
  bool force = 4;
}
message DropMigrationResponse {
  Migration migration = 1;
  MigrationStatus status = 2;
}

// Connection is a stored, named source conninfo. It is scoped to the shard
// whose Migrator created it — its row lives only in that shard's own
// multigres.migration_connection, so which shard it belongs to is implied by
// which Migrator you asked, not a field on the message. Every migration
// references one by id via Migration.connection_name — live, not a one-time
// copy — so altering it (UpdateConnection) takes effect on every migration
// that references it.
message Connection {
  int64 id = 1;
  // name is the unique, required identifier used to reference this connection
  // from Migration.connection_name.
  string name = 2;
  // dsn is a full libpq conninfo (may include TLS options). Returned as-is on
  // read paths, which may expose a password — same trust model as
  // Migration.connection_name's resolved source; see that field's doc comment.
  string dsn = 3;
  google.protobuf.Timestamp created_at = 4;
}

// ConnectionRef addresses one connection: by id, or by its unique name.
message ConnectionRef {
  oneof ref {
    int64 id = 1;
    string name = 2;
  }
}

message CreateConnectionRequest {
  Connection connection = 1;
}
message CreateConnectionResponse {
  Connection connection = 1;
}

// UpdateConnectionRequest changes mutable fields; only fields named in
// update_mask are applied. Only "dsn" is mutable today. connection.id or
// connection.name (whichever is set) addresses the connection being updated.
message UpdateConnectionRequest {
  Connection connection = 1;
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateConnectionResponse {
  Connection connection = 1;
}

// GetConnectionRequest addresses one connection by ref (id or name).
message GetConnectionRequest {
  ConnectionRef ref = 1;
}
message GetConnectionResponse {
  Connection connection = 1;
}

// ListConnectionsRequest lists every stored connection in full (unlike
// ListMigrationsRequest, which returns ids only) — there is no "fetch one at a
// time" need here, and SHOW CONNECTIONS wants the whole table in one call.
message ListConnectionsRequest {
}
message ListConnectionsResponse {
  repeated Connection connections = 1;
}

// DropConnectionRequest is addressed by ref (id or name). Dropping a
// connection still referenced by a migration (migration.connection_id) fails
// with a foreign-key-violation error; point those migrations elsewhere first.
message DropConnectionRequest {
  ConnectionRef ref = 1;
  bool if_exists = 2;
}
message DropConnectionResponse {
}

// Migrator coordinates one logical-replication migration per workflow,
// from a standalone source postgres into a multigres target shard.
service Migrator {
  // CreateMigration records a migration's configuration (no database changes).
  rpc CreateMigration(CreateMigrationRequest) returns (CreateMigrationResponse);

  // StartMigration runs the workflow: validate, schema copy, publication,
  // subscription, and initial catch-up.
  rpc StartMigration(StartMigrationRequest) returns (StartMigrationResponse);

  // UpdateMigration changes mutable fields (field-masked), notably the source
  // connection.
  rpc UpdateMigration(UpdateMigrationRequest) returns (UpdateMigrationResponse);

  // GetMigration returns status for one migration, addressed by ref (id or name).
  rpc GetMigration(GetMigrationRequest) returns (GetMigrationResponse);

  // ListMigrations returns the ids of every migration; fetch full details for
  // each via GetMigration.
  rpc ListMigrations(ListMigrationsRequest) returns (ListMigrationsResponse);

  // GetMigrationJournal returns a migration's append-only audit journal (oldest
  // first). Internal audit surface; entries are retained after a drop, so this
  // returns them even for a migration whose row is gone (addressed by id).
  rpc GetMigrationJournal(GetMigrationJournalRequest) returns (GetMigrationJournalResponse);

  // ActivateMigration cuts over to serving (IMPORT -> EXPORT): drain, flip
  // direction, and start serving. Requires the current direction to be IMPORT.
  rpc ActivateMigration(ActivateMigrationRequest) returns (ActivateMigrationResponse);

  // DeactivateMigration rolls back to non-serving (EXPORT -> IMPORT): stop
  // serving, then flip direction. Requires the current direction to be EXPORT.
  rpc DeactivateMigration(DeactivateMigrationRequest) returns (DeactivateMigrationResponse);

  // DropMigration tears down the subscription/publication/slot and removes
  // the workflow (default drains first; wait/force modify that).
  rpc DropMigration(DropMigrationRequest) returns (DropMigrationResponse);

  // CreateConnection stores a named source conninfo, shard-scoped.
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);

  // UpdateConnection changes a connection's dsn (field-masked). Takes effect
  // immediately for every migration that references it.
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse);

  // GetConnection returns one connection, addressed by ref (id or name).
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);

  // ListConnections returns every stored connection in full.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);

  // DropConnection removes a connection. Fails if a migration still
  // references it.
  rpc DropConnection(DropConnectionRequest) returns (DropConnectionResponse);
}
