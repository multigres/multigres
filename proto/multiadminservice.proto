  // ListConnections returns every stored connection in full.
  rpc ListConnections(migrator.ListConnectionsRequest) returns (migrator.ListConnectionsResponse) {
    option (openapi.v3.operation) = {
      summary: "List connections"
      tags: "connections"
      responses: {
        response_or_reference: {name: "default" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "400" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "401" value: {reference: {_ref: "#/components/responses/RPCError"}}}
