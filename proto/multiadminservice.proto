// GetCellRequest specifies the cell to retrieve
message GetCellRequest {
  // name is the name of the cell to retrieve
  string name = 1;
}

// GetCellResponse contains the cell information
message GetCellResponse {
  // Cell metadata.
  clustermetadata.Cell cell = 1;
}

// GetDatabaseRequest specifies the database to retrieve
message GetDatabaseRequest {
  // name is the name of the database to retrieve
  string name = 1;
}

// GetDatabaseResponse contains the database information
message GetDatabaseResponse {
  // Database metadata.
  clustermetadata.Database database = 1;
}

// GetCellNamesRequest requests all cell names
message GetCellNamesRequest {
}

// GetCellNamesResponse contains all cell names
message GetCellNamesResponse {
  repeated string names = 1;
}

// GetDatabaseNamesRequest requests all database names
message GetDatabaseNamesRequest {
}

// GetDatabaseNamesResponse contains all database names
message GetDatabaseNamesResponse {
  repeated string names = 1;
}

// GetGatewaysRequest requests gateways with optional filtering
message GetGatewaysRequest {
  // Optional cell names to filter by. Repeat the REST query parameter: ?cells=a&cells=b.
  repeated string cells = 1;
  // only_reachable drops gateways whose grpc address does not accept a TCP
  // connection, filtering out stale registrations left by dead pods.
  bool only_reachable = 2;
}

// GetGatewaysResponse contains the filtered gateways
message GetGatewaysResponse {
  // Gateways matching the requested cells.
  repeated clustermetadata.Multigateway gateways = 1;
}

// GetPoolersRequest requests poolers with optional filtering
message GetPoolersRequest {
  // Optional cell names to filter by. Repeat the REST query parameter: ?cells=a&cells=b.
  repeated string cells = 1;
  // database name to filter by (optional)
  string database = 2;
  // shard name to filter by (optional)
  string shard = 3;
}

// GetPoolersResponse contains the filtered poolers
message GetPoolersResponse {
  // Poolers matching the requested cells, database, and shard.
  repeated clustermetadata.Multipooler poolers = 1;
}

// GetOrchsRequest requests orchestrators with optional filtering
message GetOrchsRequest {
  // Optional cell names to filter by. Repeat the REST query parameter: ?cells=a&cells=b.
  repeated string cells = 1;
}

// GetOrchsResponse contains the filtered orchestrators
message GetOrchsResponse {
  // Orchestrators matching the requested cells.
  // protolint:disable:next REPEATED_FIELD_NAMES_PLURALIZED
  repeated clustermetadata.Multiorch orchs = 1;
}

// Backup operation messages

// BackupRequest requests an async backup of a specific shard
message BackupRequest {
  // database name (required)
  string database = 1;
  // table_group name (required)
  string table_group = 2;
  // shard name (required)
  string shard = 3;
  // type of backup: "full", "differential", or "incremental" (required)
  string type = 4;
  // force_primary forces the backup to run on the primary instead of a replica.
  // This should typically be false because backups on replicas reduce load on the primary.
  bool force_primary = 5;
}

// BackupResponse contains the job ID for tracking the async backup
message BackupResponse {
  // job_id is the unique identifier for tracking this backup job
  string job_id = 1;
}

// GetBackupJobStatus operation messages

// GetBackupJobStatusRequest requests the status of a backup or restore job
message GetBackupJobStatusRequest {
  // job_id to query (required)
  string job_id = 1;

  // Shard context for fallback lookup via Multipooler when job is not in memory.
  // Required when job may have been lost due to process restart.
  string database = 2;
  string table_group = 3;
  string shard = 4;
}

// GetBackupJobStatusResponse contains the current status of a backup or restore job
message GetBackupJobStatusResponse {
  // job_id is the unique identifier for this job
  string job_id = 1;
  // job_type indicates whether this is a backup or restore job
  JobType job_type = 2;
  // status indicates the current state of the job
  JobStatus status = 3;
  // error_message contains the error if status is FAILED
  string error_message = 4;

  // Original request context
  string database = 5;
  string table_group = 6;
  string shard = 7;

  // For backup jobs
  string backup_type = 8; // "full", "differential", "incremental"

  // For restore jobs
  string requested_backup_id = 10; // What was requested (may be empty for "latest")

  // Results (set when status = COMPLETED)
  // For backup: created backup_id
  // For restore: backup_id that was restored
  string backup_id = 11;
}

// JobType indicates the type of async job
enum JobType {
  JOB_TYPE_UNKNOWN = 0;
  JOB_TYPE_BACKUP = 1;
  JOB_TYPE_RESTORE = 2;
}

// JobStatus indicates the current state of an async job
enum JobStatus {
  JOB_STATUS_UNKNOWN = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
}

// GetBackups operation messages

// GetBackupsRequest selects a backup repository and limits the returned inventory.
message GetBackupsRequest {
  // Database whose backup inventory to query (required).
  string database = 1;
  // Table group whose backup inventory to query (required).
  string table_group = 2;
  // Shard context. Pooler selection currently uses database and table_group.
  string shard = 3;
  // limit on number of results (optional, 0 means no limit)
  uint32 limit = 4;
}

// GetBackupsResponse contains the list of backup artifacts
message GetBackupsResponse {
  // backups is the list of backup information
  repeated BackupInfo backups = 1;
}

// ExpireBackupsRequest requests expiration of old backups
message ExpireBackupsRequest {
  option (openapi.v3.schema) = {
    required: "database"
    required: "tableGroup"
  };
  // database name (required)
  string database = 1 [(openapi.v3.property) = {min_length: 1}];
  // table_group name (required)
  string table_group = 2 [(openapi.v3.property) = {min_length: 1}];
  // shard name (required)
  string shard = 3;
  // Optional overrides for pgbackrest expire command-line flags.
  map<string, string> overrides = 4;
}

// ExpireBackupsResponse contains the result of backup expiration
message ExpireBackupsResponse {
  // IDs of backups that were removed by the expiration.
  repeated string expired_backup_ids = 1;
}

// VerifyBackupsRequest requests a stanza-wide verify run.
message VerifyBackupsRequest {
  option (openapi.v3.schema) = {
    required: "database"
    required: "tableGroup"
    required: "shard"
  };
  // database name (required)
  string database = 1 [(openapi.v3.property) = {min_length: 1}];
  // table_group name (required)
  string table_group = 2 [(openapi.v3.property) = {min_length: 1}];
  // shard name (required)
  string shard = 3 [(openapi.v3.property) = {min_length: 1}];
}

// VerifyBackupsResponse contains the result of a verify run.
message VerifyBackupsResponse {
  // Elapsed verification time, encoded as protobuf seconds (for example, "1.500s").
  google.protobuf.Duration duration = 1;
  // Diagnostic output from pgbackrest verify.
  string raw_output = 2;
}

// BackupInfo contains information about a single backup artifact
message BackupInfo {
  // backup_id uniquely identifies this backup (e.g., "20250117-123456F")
  string backup_id = 1;
  // database name
  string database = 2;
  // table_group name
  string table_group = 3;
  // shard name
  string shard = 4;
  // type of backup: "full", "differential", or "incremental"
  string type = 5;
  // status of the backup
  BackupStatus status = 6;
  // backup_size_bytes is the size of the backup in bytes
  uint64 backup_size_bytes = 7;
  // multipooler_service_id is the ID of the multipooler that reported the backup
  string multipooler_service_id = 8;
  // routing_role is the routing role of the multipooler that created the backup
  // (PRIMARY or REPLICA)
  clustermetadata.RoutingRole routing_role = 9;
  // start_lsn is the WAL start LSN of the backup (pgbackrest backup[].lsn.start)
  string start_lsn = 10;
  // stop_lsn is the WAL stop LSN of the backup (pgbackrest backup[].lsn.stop)
  string stop_lsn = 11;
  // pg_version is the full PostgreSQL server_version the backup was taken from (e.g. "16.2")
  string pg_version = 12;
  // start_timestamp is when the backup started, from pgbackrest info backup[].timestamp.start.
  // Unset if unknown.
  google.protobuf.Timestamp start_timestamp = 13;
  // stop_timestamp is when the backup completed, from pgbackrest info backup[].timestamp.stop.
  // Unset if unknown.
  google.protobuf.Timestamp stop_timestamp = 14;
  // job_id is the multiadmin backup job ID that produced this backup, if known
  // (from the pgbackrest job_id annotation).
  string job_id = 15;
}

// BackupStatus indicates the state of a backup artifact
enum BackupStatus {
  BACKUP_STATUS_UNKNOWN = 0;
  BACKUP_STATUS_INCOMPLETE = 1;
  BACKUP_STATUS_COMPLETE = 2;
  BACKUP_STATUS_FAILED = 3;
}

// GetPoolerStatus operation messages

// GetPoolerStatusRequest requests the status of a specific pooler
message GetPoolerStatusRequest {
  // pooler_id identifies which pooler to query (required)
  clustermetadata.ID pooler_id = 1;
}

// GetPoolerStatusResponse contains the pooler's unified status
message GetPoolerStatusResponse {
  // status contains the pooler's unified status from MultipoolerManager.Status
  multipoolermanagerdata.Status status = 1;
  // consensus_status is the pooler's current consensus state, forwarded from StatusResponse.
  clustermetadata.ConsensusStatus consensus_status = 2;
}

// PostgreSQL Monitoring Control operation messages

// SetPostgresRestartsEnabledRequest requests to enable or disable automatic PostgreSQL restarts on a pooler
message SetPostgresRestartsEnabledRequest {
  // pooler_id identifies which pooler to update (required)
  clustermetadata.ID pooler_id = 1;

  // enabled controls whether automatic restarts are enabled (true) or suppressed (false)
  bool enabled = 2;
}

// SetPostgresRestartsEnabledResponse confirms that the flag was updated
// Errors are returned via gRPC status codes, not in the response body
message SetPostgresRestartsEnabledResponse {
  // Empty - success indicated by no error
}

// Gateway diagnostics operation messages

// GetGatewayQueriesRequest specifies which gateway to query and how to bound
// the response.
message GetGatewayQueriesRequest {
  // gateway_id identifies which gateway to query (required)
  clustermetadata.ID gateway_id = 1;

  // limit caps the number of fingerprints returned, sorted by call count
  // descending. 0 means no limit.
  uint32 limit = 2;

  // min_calls drops fingerprints whose total call count is below this
  // threshold. 0 means no threshold.
  uint64 min_calls = 3;
}

// GetGatewayQueriesResponse contains the gateway's per-fingerprint query registry snapshot.
message GetGatewayQueriesResponse {
  // snapshot contains the registry data from MultigatewayManager.GetQueryRegistry
  multigatewaymanagerdata.QueryRegistrySnapshot snapshot = 1;
}

// GetGatewayConsolidatorRequest specifies which gateway to query.
message GetGatewayConsolidatorRequest {
  // gateway_id identifies which gateway to query (required)
  clustermetadata.ID gateway_id = 1;
}

// GetGatewayConsolidatorResponse contains the gateway's consolidator snapshot.
message GetGatewayConsolidatorResponse {
  // stats contains the consolidator data from MultigatewayManager.GetConsolidatorStats
  multigatewaymanagerdata.ConsolidatorStats stats = 1;
}

// ApplyCertifiedRuleChange operation messages

// ApplyCertifiedRuleChangeRequest installs a new shard rule using an externally
// certified revocation. See multiorch.ApplyCertifiedRuleChangeRequest for the
// safety contract behind the cert.
//
// Multiadmin populates the identity and timing fields that the caller did not
// fill in (rule_number, coordinator_id, creation_time, term_revocation.*) by
// looking up a multiorch in the shard's cell and using "now" for timestamps,
// then forwards the fully-populated request to that multiorch.
message ApplyCertifiedRuleChangeRequest {
  option (openapi.v3.schema) = {
    any_of: {schema: {
      required: "cert"
      properties: {additional_properties: {name: "cert" value: {schema: {}}}}
    }}
    any_of: {schema: {
      required: "unsafeDeriveCert"
      properties: {additional_properties: {name: "unsafeDeriveCert" value: {schema: {}}}}
    }}
  };
  // Shard to apply the rule change to.
  clustermetadata.ShardKey shard_key = 1;

  // The transition to install. The caller must populate proposal's leader_id,
  // cohort_members, and durability_policy. The caller may also populate
  // proposal's rule_number, coordinator_id, and creation_time; if any of
  // those are left unset, multiadmin fills them in (rule_number from the
  // cert's revoked_below_term, coordinator_id from the chosen multiorch,
  // creation_time from "now").
  //
  // decision is the caller's discovered outgoing rule — optional. If left
  // unset with unsafe_derive_cert, multiadmin discovers it itself by probing
  // the proposed cohort (see probeMostAdvanced), the same way it derives
  // frozen_lsn. See multiorch.ApplyCertifiedRuleChangeRequest for why
  // decision may name a rule observed only as an undecided proposal (the
  // cert makes propagating it "free").
  clustermetadata.RulePosition proposed_transition = 2;

  // How the externally certified revocation is supplied. Exactly one branch
  // must be set.
  oneof cert_source {
    // Caller-supplied cert. The caller must populate outgoing_rule_number
    // and frozen_lsn. term_revocation may be left empty; if so, multiadmin
    // fills it in (accepted_coordinator_id from the chosen multiorch,
    // coordinator_initiated_at from "now", revoked_below_term picked by
    // multiadmin to be greater than outgoing_rule_number.coordinator_term).
    //
    // For initial leader appointment (no prior rule), pass a zero RuleNumber
    // and frozen_lsn="0/0".
    clustermetadata.ExternallyCertifiedRevocation cert = 3;

    // Ask multiadmin to derive outgoing_rule_number and frozen_lsn by
    // probing the proposed cohort for their current ConsensusStatus.
    // term_revocation and rule identity fields are then filled in as above.
    UnsafeDeriveCertOptions unsafe_derive_cert = 4;
  }

  // Free-text, recorded in rule_history for audit.
  string reason = 5;
}

// UnsafeDeriveCertOptions requests that multiadmin probe the proposed cohort
// members for their current ConsensusStatus and derive cert.outgoing_rule_number
// and cert.frozen_lsn from the most-advanced response.
//
// Unsafe because if an unreachable node is actually ahead of the reachable
// set, the derived cert is wrong: the new rule could be installed on a
// timeline that conflicts with the absent node's committed writes. The
// pooler-side ValidateRevocation check prevents corruption if the absent
// node comes back, but data loss is possible. Intended for stuck-quorum
// recovery where the caller explicitly accepts that risk.
message UnsafeDeriveCertOptions {
  // Reserved for future tuning knobs (probe timeout, cohort subset, etc.).
}

// ApplyCertifiedRuleChangeResponse contains the installed rule and the certificate used.
message ApplyCertifiedRuleChangeResponse {
  // The fully-populated rule that was installed, after multiadmin filled in
  // any identity fields the caller omitted.
  clustermetadata.ShardRule installed_rule = 1;

  // The fully-populated cert that was applied. When unsafe_derive_cert was
  // used or term_revocation was filled in by multiadmin, this exposes the
  // values that multiadmin chose.
  clustermetadata.ExternallyCertifiedRevocation cert_used = 2;
}

// SwitchPrimary operation messages

// SwitchPrimaryRequest identifies the shard and the audit reason for a graceful switchover.
message SwitchPrimaryRequest {
  // Shard to perform the switchover on (required).
  clustermetadata.ShardKey shard_key = 1;

  // Free-text reason recorded in rule_history for audit.
  string reason = 2;
}

// SwitchPrimaryResponse identifies the demoted pooler; election of its replacement is asynchronous.
message SwitchPrimaryResponse {
  // The pooler that was demoted.
  clustermetadata.ID old_leader_id = 1;
}
