        response_or_reference: {name: "401" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "404" value: {reference: {_ref: "#/components/responses/RPCError"}}}
      }
    };
    option (google.api.http) = {
      post: "/api/v1/migrations"
      body: "*"
    };
  }

  // GetMigration returns status for one migration, addressed by ref (id or name).
  rpc GetMigration(migrator.GetMigrationRequest) returns (migrator.GetMigrationResponse) {
    option (openapi.v3.operation) = {
      summary: "Get a migration"
      tags: "migrations"
      responses: {
        response_or_reference: {name: "default" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "400" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "401" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "404" value: {reference: {_ref: "#/components/responses/RPCError"}}}
      }
    };
    option (google.api.http) = {get: "/api/v1/migrations/{ref.id}"};
  }

  // ListMigrations returns the ids of every migration.
  rpc ListMigrations(migrator.ListMigrationsRequest) returns (migrator.ListMigrationsResponse) {
    option (openapi.v3.operation) = {
      summary: "List migrations"
      tags: "migrations"
      responses: {
        response_or_reference: {name: "default" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "400" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "401" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "404" value: {reference: {_ref: "#/components/responses/RPCError"}}}
      }
    };
    option (google.api.http) = {get: "/api/v1/migrations"};
  }

  // SetMigrationDirection sets the active direction: on a not-yet-started
  // migration, direction=IMPORT runs the setup pipeline; otherwise it performs
  // the symmetric cutover (IMPORT -> EXPORT) or rollback (EXPORT -> IMPORT).
  rpc SetMigrationDirection(migrator.SetMigrationDirectionRequest) returns (migrator.SetMigrationDirectionResponse) {
    option (openapi.v3.operation) = {
      summary: "Set a migration's direction"
      tags: "migrations"
      responses: {
        response_or_reference: {name: "default" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "400" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "401" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "404" value: {reference: {_ref: "#/components/responses/RPCError"}}}
