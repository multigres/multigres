        response_or_reference: {name: "400" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "401" value: {reference: {_ref: "#/components/responses/RPCError"}}}
        response_or_reference: {name: "404" value: {reference: {_ref: "#/components/responses/RPCError"}}}
