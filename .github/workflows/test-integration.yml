name: Multigres Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test-integration:
    # One job per slice of the end-to-end tree. Tests inside a package run
    # sequentially, so the three packages that each take 10-20 minutes are
    # split by test name across shards (see resolve-test-slice.sh); the rest
    # fits in one job. The slice names are required status checks in the
    # main branch ruleset, so renaming or adding one means updating it.
    name: Integration (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rest
            topology: multigres
            packages: ./go/test/endtoend/...
            skip_packages: /endtoend/(multiorch|queryserving|multipooler)$
          - name: multiorch-1
            topology: multigres
            packages: ./go/test/endtoend/multiorch/
            shard: 1/3
          - name: multiorch-2
            topology: multigres
            packages: ./go/test/endtoend/multiorch/
            shard: 2/3
          - name: multiorch-3
            topology: multigres
            packages: ./go/test/endtoend/multiorch/
            shard: 3/3
          - name: queryserving-1
            topology: multigres
            packages: ./go/test/endtoend/queryserving/
            shard: 1/2
          - name: queryserving-2
            topology: multigres
            packages: ./go/test/endtoend/queryserving/
            shard: 2/2
          - name: multipooler
            topology: multigres
            packages: ./go/test/endtoend/multipooler/
          # Runs the query-serving tests against a single Minigres process
          # instead of a Multigres shard; tests that need Multiorch, replicas
          # or several gateways skip themselves.
          - name: minigres-queryserving-1
            topology: minigres
            packages: ./go/test/endtoend/queryserving/ ./go/test/endtoend/queryserving/pgparity/
            shard: 1/2
          - name: minigres-queryserving-2
            topology: minigres
            packages: ./go/test/endtoend/queryserving/ ./go/test/endtoend/queryserving/pgparity/
            shard: 2/2
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: ci
      deployment: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up test environment
        run: .github/scripts/setup-test-environment.sh

      - name: Build
        run: make build

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Start port pool server
        run: |
          ./bin/portpoolserver --socket /tmp/multigres-port-pool.sock &
          echo "PORT_POOL_PID=$!" >> "$GITHUB_ENV"
          echo "MULTIGRES_PORT_POOL_ADDR=/tmp/multigres-port-pool.sock" >> "$GITHUB_ENV"

      - name: Run integration tests
        id: integration-tests
        # continue-on-error lets the Trunk upload step below gate the job
        # instead: it passes when every failure is quarantined, fails otherwise.
        continue-on-error: true
        env:
          TEST_PRINT_LOGS: "1"
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key
          MULTIGRES_E2E_TOPOLOGY: ${{ matrix.topology }}
          TEST_PACKAGES: ${{ matrix.packages }}
          SKIP_PACKAGES: ${{ matrix.skip_packages }}
          SHARD: ${{ matrix.shard }}
        run: .github/scripts/run-integration-slice.sh

      - name: Stop port pool server
        run: kill "$PORT_POOL_PID" || true

      - name: Write timing summary
        if: ${{ !cancelled() }}
        run: go run ./go/tools/testtiming/summary

      - name: Upload test results to Trunk
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-test-results
        with:
          junit-paths: integration-test-results.xml
          previous-step-outcome: ${{ steps.integration-tests.outcome }}
          allow-quarantine: "true"

      # The "-test-logs" suffix is what the flaky-test aggregator matches on.
      - name: Upload test logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: integration-${{ matrix.name }}-test-logs
          path: |
            integration-test-results.jsonl
            integration-test-results.xml
          retention-days: 14

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Integration Tests (${{ matrix.name }})
          path: integration-test-results.jsonl
          reporter: golang-json

      # Only upload test results from main-branch pushes. On PRs, Codecov's
      # test-results comment template replaces the coverage comment when any
      # test fails, displacing the coverage diff that PR authors actually want
      # to see. Flake tracking only needs main-branch history anyway.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./integration-test-results.xml
          report_type: test_results
          flags: integration${{ matrix.topology == 'minigres' && '-minigres' || '' }}
          fail_ci_if_error: false
