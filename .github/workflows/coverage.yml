name: Code Coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: {}
jobs:
  coverage:
    # One job per slice of the test tree. Tests inside a package run
    # sequentially, so the three end-to-end packages that each take 10-20
    # minutes are split by test name across shards; everything else fits in
    # one job. Each job collects both coverage mechanisms in a single pass:
    # -coverpkg instruments the test process, and
    # MULTIGRES_SUBPROCESS_GOCOVERDIR (see pathutil.PrependBinToPath) points
    # the spawned bin/cov services at a directory we own, since `go test`
    # otherwise hands them a private GOCOVERDIR whose contents it discards.
    name: Coverage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests plus every end-to-end package not sharded below.
          - name: rest
            topology: multigres
            packages: ./...
            skip_packages: /endtoend/(multiorch|queryserving|multipooler)$
          - name: multiorch-1
            topology: multigres
            packages: ./go/test/endtoend/multiorch/
            shard: 1/3
          - name: multiorch-2
            topology: multigres
            packages: ./go/test/endtoend/multiorch/
            shard: 2/3
          - name: multiorch-3
            topology: multigres
            packages: ./go/test/endtoend/multiorch/
            shard: 3/3
          - name: queryserving-1
            topology: multigres
            packages: ./go/test/endtoend/queryserving/
            shard: 1/2
          - name: queryserving-2
            topology: multigres
            packages: ./go/test/endtoend/queryserving/
            shard: 2/2
          - name: multipooler
            topology: multigres
            packages: ./go/test/endtoend/multipooler/
          # Minigres runs the packages that run against it in
          # test-integration.yml.
          - name: minigres-queryserving-1
            topology: minigres
            packages: ./go/test/endtoend/queryserving/ ./go/test/endtoend/queryserving/pgparity/
            shard: 1/2
          - name: minigres-queryserving-2
            topology: minigres
            packages: ./go/test/endtoend/queryserving/ ./go/test/endtoend/queryserving/pgparity/
            shard: 2/2
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Set up test environment
        run: .github/scripts/setup-test-environment.sh
      - name: Build coverage binaries
        run: make build-coverage
      - name: Start port pool server
        run: |
          ./bin/cov/portpoolserver --socket /tmp/multigres-port-pool.sock &
          echo "PORT_POOL_PID=$!" >> "$GITHUB_ENV"
          echo "MULTIGRES_PORT_POOL_ADDR=/tmp/multigres-port-pool.sock" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        env:
          MULTIGRES_E2E_TOPOLOGY: ${{ matrix.topology }}
          TEST_PACKAGES: ${{ matrix.packages }}
          SKIP_PACKAGES: ${{ matrix.skip_packages }}
          SHARD: ${{ matrix.shard }}
        run: .github/scripts/run-coverage-slice.sh

      - name: Stop port pool server
        run: kill "$PORT_POOL_PID" || true
      - name: Write timing summary
        if: ${{ !cancelled() }}
        run: go run ./go/tools/testtiming/summary coverage-test-results.jsonl
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: |
            coverage-direct.txt
            coverage-subprocess.txt
          retention-days: 7
      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Coverage Tests (${{ matrix.name }})
          path: coverage-test-results.jsonl
          reporter: golang-json
  merge-and-upload:
    name: Merge coverage and upload
    runs-on: ubuntu-24.04
    needs: [coverage]
    if: always()
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # One artifact per matrix slice, each downloaded into a directory
      # named after it and holding a direct and a subprocess profile.
      - name: Download coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*
          path: ./coverage-artifacts
      - name: Merge coverage files
        run: |
          mapfile -t inputs < <(find coverage-artifacts -name 'coverage-*.txt' | sort)
          ./scripts/merge-coverage.sh "${inputs[@]}" coverage-merged.txt

          echo ""
          echo "Final coverage summary:"
          go tool cover -func=coverage-merged.txt | tail -1
      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-merged
          path: coverage-merged.txt
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-merged.txt
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          file: ./coverage-merged.txt
          format: golang
          parallel: true
          flag-name: merged
  coveralls-finish:
    name: Finish Coveralls upload
    runs-on: ubuntu-24.04
    needs: [coverage, merge-and-upload]
    permissions:
      pull-requests: write
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          parallel-finished: true
