# Compares the gateway evaluation engine's ported builtins (go/common/pgeval)
# against a PostgreSQL 17.6 server built from the pinned source. The test is
# opt-in because every invocation compiles PostgreSQL; the ordinary PR
# integration job skips it. This workflow runs it on the same labels as the
# other PostgreSQL compatibility suites so it reports as its own check.
name: Expression Engine Differential Tests

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 4 * * 1" # Monday 4:00 AM UTC
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

jobs:
  test-pgeval-differential:
    name: Run expression engine differential tests
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'Run Extended Query Serving Tests') ||
      contains(github.event.pull_request.labels.*.name, 'Run all Query Serving Tests')
    runs-on: ubuntu-24.04
    environment:
      name: ci
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up test environment
        run: .github/scripts/setup-test-environment.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libreadline-dev zlib1g-dev

      - name: Build
        run: make build

      - name: Start port pool server
        run: |
          ./bin/portpoolserver --socket /tmp/multigres-port-pool.sock &
          echo "PORT_POOL_PID=$!" >> "$GITHUB_ENV"
          echo "MULTIGRES_PORT_POOL_ADDR=/tmp/multigres-port-pool.sock" >> "$GITHUB_ENV"

      - name: Run expression engine differential tests
        env:
          RUN_PGEVAL_DIFFERENTIAL: "1"
        run: |
          set -euo pipefail
          # The test skips when build tools are missing so local runs stay
          # cheap; CI must fail instead of silently losing its oracle coverage.
          command -v make
          command -v gcc
          go test -json -v -count=1 -run '^TestScalarsAgainstPostgres$' \
            -timeout=25m ./go/test/endtoend/pgeval \
            | tee pgeval-differential-results.jsonl | go tool tparse -follow

      - name: Stop port pool server
        if: always()
        run: kill "$PORT_POOL_PID" || true

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: pgeval-differential-results
          path: pgeval-differential-results.jsonl
          retention-days: 14

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Expression Engine Differential Tests
          path: pgeval-differential-results.jsonl
          reporter: golang-json
