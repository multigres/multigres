name: PostgREST IO Suite

# Runs the proxy-relevant subset of PostgREST's upstream pytest `test/io` suite
# with PostgREST pointed at the multigateway. Unlike the hspec suite, this
# exercises role-level settings hoisted per request via set_config($1,$2,true),
# statement_timeout, hoisted tx settings and prepared statements. Unlike the
# hspec suite, the io suite spawns real postgrest binaries and drives them over
# HTTP. The direct-PostgreSQL baseline is an asserted invariant, so this
# job is gateway-only and every gateway failure is a divergence; the divergence
# count is written to the job summary via io_report.go. Opt-in only: runs when a
# PR is labeled "Run Extended Query Serving Tests" / "Run all Query Serving
# Tests", or on manual dispatch.
on: # yamllint disable-line rule:truthy
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions: {}

jobs:
  test-postgrest-io:
    name: Run PostgREST io suite
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'Run Extended Query Serving Tests') ||
      contains(github.event.pull_request.labels.*.name, 'Run all Query Serving Tests')
    runs-on: ubuntu-24.04
    environment:
      name: ci
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up test environment
        run: .github/scripts/setup-test-environment.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # build-essential/bison/flex/libreadline/zlib build the multigres
          # binaries. The io fixtures need no contrib/PostGIS extensions, so
          # unlike the hspec job this does not install postgresql-17-postgis-3.
          sudo apt-get install -y \
            build-essential bison flex libreadline-dev zlib1g-dev

      - name: Build
        run: make build

      - name: Start port pool server
        run: |
          ./bin/portpoolserver --socket /tmp/multigres-port-pool.sock &
          echo "PORT_POOL_PID=$!" >> "$GITHUB_ENV"
          echo "MULTIGRES_PORT_POOL_ADDR=/tmp/multigres-port-pool.sock" >> "$GITHUB_ENV"

      - name: Run PostgREST io suite
        # The test fails on any gateway divergence; pipefail propagates that exit
        # code through tparse so the job goes red. The divergence count is
        # written to the job summary regardless.
        env:
          RUN_EXTENDED_QUERY_SERVING_TESTS: "1"
          TEST_PRINT_LOGS: "1"
        run: |
          set -o pipefail
          go test -json -v -run 'TestPostgRESTIO$' \
            ./go/test/endtoend/queryserving/postgresttests/... \
            -timeout 55m | tee postgrest-io-results.jsonl | go tool tparse -follow

      - name: Stop port pool server
        if: always()
        run: kill "$PORT_POOL_PID" || true

      - name: Upload PostgREST io results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: postgrest-io-results
          path: |
            /tmp/multigres_postgrest_cache/results/**/*
            postgrest-io-results.jsonl
          if-no-files-found: warn

      # On failure, surface the per-process cluster logs from the shardsetup
      # tempdir (multipooler.log, pgctld.log, multigateway.log, multiorch.log).
      - name: Upload cluster logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: postgrest-io-cluster-logs
          path: /tmp/shardsetup_test_*/**/*.log
          if-no-files-found: warn
          retention-days: 7
